  <text x="800" y="838" text-anchor="middle" font-size="17" letter-spacing="3" font-family="Verdana, Arial, sans-serif" fill="#c9b8a4">UN BIEN FOU · LE MÉDIA POSITIF · SOURCÉ · VÉRIFIÉ</text>
