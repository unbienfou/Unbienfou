  <text x="165" y="88" font-size="40" font-style="italic" fill="#fff3de">Un bien fou</text>
  <text x="167" y="120" font-size="15" letter-spacing="5" fill="#e8a06a" font-family="Verdana, Arial, sans-serif">LE MÉDIA POSITIF</text>

  <!-- Encadré 1 (élargi) : pastille kicker -->
  <rect x="438" y="168" width="724" height="64" rx="32" fill="#241b14" stroke="#f0a56a" stroke-width="2"/>
