  <!-- Bulle-bouche du cactus -->
  <path d="M 1098 505 L 1126 528 L 1218 645 " fill="#FFFFFF" stroke="none"/>
  <path d="M 1098 505 L 1126 528" fill="none" stroke="#1c1917" stroke-width="4"/>
  <ellipse cx="1042" cy="452" rx="185" ry="86" fill="#FFFFFF" stroke="#1c1917" stroke-width="4"/>
  <text x="1042" y="441" text-anchor="middle" font-size="17" font-weight="bold" font-family="Verdana, Arial, sans-serif" fill="#1c1917">En direct du grand soir :</text>
  <text x="1042" y="466" text-anchor="middle" font-size="17" font-weight="bold" font-family="Verdana, Arial, sans-serif" fill="#1c1917">tout est offert, oui, oui ! ☀️</text>

