  <!-- Encadré 2 ÉLARGI : carte principale (texte à gauche) -->
  <rect x="90" y="290" width="910" height="400" rx="26" fill="#221912" opacity="0.85" stroke="#f0a56a" stroke-width="3"/>
  <text x="130" y="392" font-size="54" font-weight="bold" font-style="italic" fill="#fffaf2">BLACK FRIDAY :</text>
  <text x="130" y="462" font-size="54" font-weight="bold" font-style="italic" fill="#f8c491">NOTRE PRODUIT EST À 0 €</text>
  <text x="130" y="525" font-size="20" font-style="italic" fill="#f3ead9">Trois bonnes nouvelles et la phrase du jour, chaque matin à 7h30.</text>
  <text x="130" y="556" font-size="20" font-style="italic" fill="#f3ead9">Le prix ? Il ne bougera jamais : 100 % gratuit, sans spam.</text>
