  <rect x="180" y="272" width="1240" height="424" rx="28" fill="#241b14" stroke="#f0a56a" stroke-width="3"/>
  <text x="800" y="392" text-anchor="middle" font-size="64" font-weight="bold" font-style="italic" fill="#fff3de">BLACK FRIDAY :</text>
