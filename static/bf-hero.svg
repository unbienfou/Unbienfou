    <circle cx="120" cy="160" r="80" fill="url(#haloA)"/>
    <path d="M 60 160 A 58 58 0 0 1 176 160 Z" fill="url(#solA)"/>
    <path d="M 84 160 A 34 34 0 0 1 152 160" fill="none" stroke="#fff3de" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
    <path d="M 52 161 Q 118 154 184 161" fill="none" stroke="#8a6547" stroke-width="2.6" stroke-linecap="round"/>
    <g fill="url(#cacA)"><rect x="106" y="74" width="24" height="84" rx="12"/><path d="M 106 118 q -28 -2 -28 -21 q 0 -10 10 -10 q 9 0 9 10 q 0 6 9 8 z"/><path d="M 130 106 q 28 -2 28 -26 q 0 -10 10 -10 q 9 0 9 10 q 0 40 -47 40 z"/></g>
    <circle cx="118" cy="66" r="6" fill="#e88a6a"/><circle cx="118" cy="66" r="2.4" fill="#fff3de"/>
