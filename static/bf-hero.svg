    <radialGradient id="haloA" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#f8c491" stop-opacity="0.55"/><stop offset="100%" stop-color="#f8c491" stop-opacity="0"/></radialGradient>
    <linearGradient id="cacA" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8aa882"/><stop offset="50%" stop-color="#6d8f68"/><stop offset="100%" stop-color="#527055"/></linearGradient>
    <linearGradient id="fondA" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a1d10"/><stop offset="60%" stop-color="#17110b"/><stop offset="100%" stop-color="#120c07"/></linearGradient>
