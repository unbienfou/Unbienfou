name: Statistiques audience hebdo
on:
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Relever l'audience (GoatCounter + Brevo)
        env:
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
        run: |
          cat > audience.mjs <<'SCRIPT_EOF'
          import fs from 'fs';
          const today = new Date().toISOString().slice(0, 10);
          const debut = new Date(Date.now() - 6 * 86400000).toISOString().slice(0, 10);

          // 1. GoatCounter : visites des 7 derniers jours (Bearer puis cle nue en secours)
          let gc = 'n.c.';
          try {
            const UGC = 'https://unbienfou.goatcounter.com/api/v0/stats/total?start=' + debut + '&end=' + today;
            let r = await fetch(UGC, { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + process.env.GOATCOUNTER_API_KEY } });
            if (!r.ok && r.status === 401) {
              r = await fetch(UGC, { headers: { 'Content-Type': 'application/json', 'Authorization': process.env.GOATCOUNTER_API_KEY } });
            }
            if (r.ok) { const j = await r.json(); gc = String(j.total); } else { console.log('GOATCOUNTER : HTTP ' + r.status + ' (cle absente ou invalide)'); }
          } catch (e) { console.log('GOATCOUNTER ERREUR : ' + e.message); gc = 'erreur'; }

          // 2. Brevo : MEME METHODE QUE LE ROBOT (contacts reels de la liste, dedupliques, avec pagination)
          let abonnes = 'n.c.', envoyes = 'n.c.', ouvertures = 'n.c.', clics = 'n.c.';
          try {
            const H = { 'api-key': process.env.BREVO_API_KEY, 'accept': 'application/json' };
            const LID = String(process.env.BREVO_LIST_ID || '').trim();
            const emails = new Set();
            let offset = 0, encore = true;
            while (encore) {
              const rc = await fetch('https://api.brevo.com/v3/contacts/lists/' + LID + '/contacts?limit=50&offset=' + offset, { headers: H });
              if (!rc.ok) { console.log('BREVO CONTACTS : HTTP ' + rc.status); emails.clear(); break; }
              const jc = await rc.json();
              const page = (jc.contacts || []).filter(Boolean);
              page.forEach(c => { if (c.email) emails.add(c.email); });
              encore = page.length === 50;
              offset += 50;
            }
            if (emails.size > 0) abonnes = String(emails.size);
            const rs = await fetch('https://api.brevo.com/v3/smtp/statistics/reports?days=7&limit=30', { headers: H });
            if (rs.ok) {
              const js = await rs.json();
              console.log('BREVO STATS BRUT : ' + JSON.stringify(js).slice(0, 300));
              const reps = js.reports || [];
              if (reps.length > 0) {
                let req7 = 0, ouv7 = 0, cli7 = 0;
                reps.forEach(r => { req7 += Number(r.requests) || 0; ouv7 += Number(r.opens) || 0; cli7 += Number(r.clicks) || 0; });
                envoyes = String(req7); ouvertures = String(ouv7); clics = String(cli7);
              }
            } else { console.log('BREVO STATS : HTTP ' + rs.status); }
          } catch (e) { console.log('BREVO ERREUR : ' + e.message); }

          const ligne = today + ',' + gc + ',' + abonnes + ',' + envoyes + ',' + ouvertures + ',' + clics;
          // Reconstruction propre du fichier : une seule ligne d'en-tete,
          // suppression des doublons d'en-tete eventuels, remplacement du jour.
          const brut = fs.existsSync('audience.csv') ? fs.readFileSync('audience.csv', 'utf8') : '';
          const lignes = brut.split('\n').map(l => l.trim()).filter(Boolean);
          const data = lignes.filter(l => !l.startsWith('date,'));
          const historique = data.filter(l => !l.startsWith(today + ','));
          const fichier = ['date,visites_7j_goatcounter,brevo_abonnes,brevo_envoyes_7j,brevo_ouvertures_7j,brevo_clics_7j'].concat(historique, [ligne]).join('\n') + '\n';
          fs.writeFileSync('audience.csv', fichier);
          console.log('Audience du jour : ' + ligne);
          SCRIPT_EOF
          node audience.mjs

      - name: Publier l'audience
        run: |
          git config user.name "robot-unbienfou"
          git config user.email "action@github.com"
          git add audience.csv
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Audience du $(date +%d/%m/%Y)"
            git push
          fi
