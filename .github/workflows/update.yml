              return [...m].map(x => { const mo = {'janvier':0,'fevrier':1,'février':1,'mars':2,'avril':3,'mai':4,'juin':5,'juillet':6,'aout':7,'août':7,'septembre':8,'octobre':9,'novembre':10,'decembre':11,'décembre':11}[x[3].toLowerCase()]; return { jour: JOURS[x[1].toLowerCase()], d: new Date(new Date().getFullYear(), mo, Number(x[2])) }; }).filter(x => !isNaN(x.d.getTime()));
