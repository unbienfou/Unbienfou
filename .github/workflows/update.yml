name: Mise a jour quotidienne des articles
on:
  schedule:
    - cron: "0 5,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generer et verifier les articles de l edition
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
        run: |
          cat > update.mjs <<'SCRIPT_EOF'
          import fs from 'fs';
          const KEY = process.env.MISTRAL_API_KEY || '';
          const FEEDS = {
          france: ['https://www.francetvinfo.fr/titres.rss', 'https://www.20minutes.fr/feeds/rss-une.xml', 'https://www.lafranceagricole.fr/rss/flux.xml', 'https://www.francetvinfo.fr/societe.rss', 'https://www.leparisien.fr/services/rss//rss-une.xml', 'https://www.france24.com/fr/rss', 'https://www.francetvinfo.fr/france.rss', 'https://www.publicsenat.fr/rss.xml'],
          regions: ['https://www.ouest-france.fr/rss-en-continu.xml', 'https://www.ladepeche.fr/rss.xml', 'https://www.ledauphine.com/rss.xml', 'https://www.ladepeche.fr/rss/actualites.xml', 'https://www.ouest-france.fr/feeds/rss/une-toute', 'https://www.maville.com/rss.xml', 'https://france3-regions.francetvinfo.fr/rss.xml', 'https://www.francebleu.fr/feeds/rss/une.rss'],
          sport: ['https://www.francetvinfo.fr/sports.rss', 'https://www.lequipe.fr/rss/actu.rss', 'https://rmcsport.bfmtv.com/rss/football/', 'https://www.francebleu.fr/feeds/rss/sports.rss', 'https://rmcsport.bfmtv.com/rss/tennis/', 'https://www.eurosport.fr/rss.xml', 'https://www.lequipe.fr/rss/actu_badminton.rss', 'https://rmcsport.bfmtv.com/rss/badminton/', 'https://rmcsport.bfmtv.com/rss/basket/', 'https://rmcsport.bfmtv.com/rss/handball/', 'https://rmcsport.bfmtv.com/rss/rugby/', 'https://rmcsport.bfmtv.com/rss/cyclisme/', 'https://rmcsport.bfmtv.com/rss/voile/', 'https://rmcsport.bfmtv.com/rss/athletisme/', 'https://rmcsport.bfmtv.com/rss/sports-us/', 'https://news.google.com/rss/search?q=sport+fran%C3%A7ais+victoire+OR+troph%C3%A9e+OR+titre+when:2d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=%22%C3%A9quipe+de+France%22+qualification+OR+victoire+OR+finale+when:3d&hl=fr&gl=FR&ceid=FR:fr', 'https://www.directvelo.com/feed', 'https://fr.sportskeeda.com/feed'],
          badminton: ['https://news.google.com/rss/search?q=badminton+France&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=badminton+victoire+OR+championnat+OR+tournoi&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=%22%C3%A9quipe+de+France%22+badminton&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=badminton+fran%C3%A7ais+OR+fran%C3%A7aise+r%C3%A9sultat&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=badminton+club+OR+jeunes+OR+espoirs&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=badminton+when:2d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=FFBad+OR+%22f%C3%A9d%C3%A9ration+fran%C3%A7aise+de+badminton%22&hl=fr&gl=FR&ceid=FR:fr', 'https://www.badzine.fr/feed/', 'https://badmania.fr/rss/news.xml'],
          innovation: ['https://www.francetvinfo.fr/sciences.rss', 'https://www.sciencesetavenir.com/rss.xml', 'https://www.cnrs.fr/rss/lesoresdufutur.xml', 'https://www.usine-digitale.com/rss.xml', 'https://www.pourlascience.fr/rss.xml', 'https://www.futura-sciences.com/rss/actualites.xml', 'https://trustmyscience.com/feed/', 'https://www.sciencepost.fr/feed/'],
          ecologie: ['https://www.actu-environnement.com/rss/flux.xml', 'https://reporterre.net/feed/', 'https://www.goodplanet.org/feed/', 'https://www.notre-planete.info/rss.xml', 'https://www.chasseurimages.com/rss.xml', 'https://www.futura-sciences.com/rss/planete.xml', 'https://www.bonpote.com/feed/'],
          sante: ['https://www.pourquoidocteur.fr/feed', 'https://www.lefigaro.fr/rss/figaro_sante.xml', 'https://www.passeportsante.net/rss/rss.xml', 'https://www.francetvinfo.fr/sante.rss', 'https://sante.lefigaro.fr/rss/figaro_sante.xml', 'https://www.futura-sciences.com/rss/sante.xml'],
          solidarite: ['https://www.positivr.fr/feed/', 'https://www.20minutes.fr/feeds/rss-societe.xml', 'https://www.goodinfonews.com/rss.xml', 'https://www.huffingtonpost.fr/feeds/index.xml', 'https://reporterre.net/feed/', 'https://www.bonpote.com/feed/'],
          culture: ['https://www.francetvinfo.fr/culture.rss', 'https://www.lefigaro.fr/rss/figaro_culture.xml', 'https://www.franceinter.fr/rss.xml', 'https://www.telerama.fr/rss/television.xml', 'https://www.lesinrocks.com/feed/', 'https://www.franceinter.fr/rss.xml', 'https://www.telerama.fr/rss/cinema.xml'],
          insolite: ['https://www.francetvinfo.fr/insolite.rss', 'https://www.20minutes.fr/feeds/rss-insolite.xml', 'https://www.maxisciences.com/rss.xml', 'https://news.google.com/rss/search?q=insolite+France+%22bonne+nouvelle%22+OR+cocasse+OR+%C3%A9mouvant&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=histoire+insolite+positive+OR+touchante+OR+d%C3%A9couverte&hl=fr&gl=FR&ceid=FR:fr']
          };
          const CATS = ['france','regions','sport','badminton','innovation','ecologie','sante','solidarite','culture','insolite'];
          function pick(re, s){
          const m = s.match(re);
          return m ? m[1] : '';
          }
          async function getHeadlines(){
          let news = [];
          for (const cat of Object.keys(FEEDS)){
          for (const url of FEEDS[cat]){
          try {
          const r = await fetch(url, { headers: { 'user-agent': 'Mozilla/5.0 (compatible: UnBienFouBot/1.0; +https://unbienfou.fr)' } });
          if (!r.ok) continue;
          const xml = await r.text();
          const items = xml.split('<item').slice(1, 14);
          for (const it of items){
          const t = pick(/<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/title>/is, it).trim();
          const l = pick(/<link>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/link>/is, it).trim();
          if (t) news.push({ title: t.replace(/<[^>]+>/g, ''), url: l || url, cat: cat });
          }
          } catch (e) {}
          }
          }
          const vus = new Set();
          return news.filter(n => !vus.has(n.title) && vus.add(n.title)).slice(0, 140);
          }
          async function mistral(prompt){
          const r = await fetch('https://api.mistral.ai/v1/chat/completions', {
          method: 'POST',
          headers: { 'content-type': 'application/json', authorization: 'Bearer ' + KEY },
          body: JSON.stringify({
          model: 'mistral-small-latest',
          temperature: 0.3,
          response_format: { type: 'json_object' },
          messages: [{ role: 'user', content: prompt }]
          })
          });
          const j = await r.json();
          return JSON.parse(j.choices && j.choices[0] && j.choices[0].message.content || '{}');
          }
          const headlines = await getHeadlines();
          let articles = [];
          if (headlines.length >= 3 && KEY){
          const prompt = "Tu es la redaction du site francais Un bien fou (unbienfou.fr), un journal de bonnes nouvelles qui fait du bien. Voici des titres de la presse FRANCAISE recus aujourd'hui, classes par rubrique avec leur lien source :\n" + headlines.map(h => '- [' + h.cat + '] ' + h.title + ' [source: ' + h.url + ']').join('\n') + "\n\nParmi ces titres, selectionne les 16 meilleurs qui racontent une BONNE NOUVELLE (fait divers positif, progres, initiative, reussite, solidarite, victoire). Preferer couvrir des rubriques differentes. S'il y a une bonne nouvelle de BADMINTON, garde-la absolument et mets-la dans la categorie badminton. Redige 16 articles courts EN FRANCAIS inspires de ces titres (reformule avec prudence, sans inventer de chiffres precis, source = nom du media d'origine). COUVERTURE OBLIGATOIRE : veille a proposer au moins 1 article pour chaque rubrique presente dans les titres ci-dessus ; si une rubrique n'a aucun titre exploitable ce jour, ne la force pas (n'invente rien). Pour chaque article, recopie EXACTEMENT le lien [source: ...] correspondant dans le champ sourceUrl, et garde la categorie indiquee entre crochets. Choisis la categorie parmi : france, regions, sport, badminton, innovation, ecologie, sante, solidarite, culture, insolite. Si un titre n'est pas une bonne nouvelle, ignore-le. Reponds UNIQUEMENT avec du JSON de la forme {\"articles\":[{\"cat\":\"...\",\"title\":\"...\",\"excerpt\":\"2 phrases\",\"body\":\"3-5 phrases\",\"source\":\"...\",\"sourceUrl\":\"lien exact de la source\",\"readTime\":\"3 min\"}]}";
          try {
          const parsed = await mistral(prompt);
          articles = parsed.articles || [];
          } catch (e) {
          console.log('Erreur IA redaction : ' + e.message);
          }
          }
          if (!articles.length){
          console.log('Pas de nouvelles pour cette edition : on garde les articles existants.');
          process.exit(0);
          }
          // === AGENT VERIFICATEUR : 2e passe IA ===
          if (articles.length && KEY){
          try {
          const vPrompt = "Tu es l'agent VERIFICATEUR du journal de bonnes nouvelles Un bien fou. Voici des articles proposes par la redaction :\n" + articles.map((a, i) => (i + 1) + '. [' + a.cat + '] ' + a.title + ' — source: ' + (a.sourceUrl || 'AUCUN LIEN')).join('\n') + "\n\nPour chaque article, verifie : (1) le titre raconte bien une BONNE NOUVELLE (fait positif, progres, solidarite, reussite), PAS un simple fait divers neutre ou negatif ; (2) un lien source plausible est fourni ; (3) la categorie est coherente (une histoire de badminton doit rester en categorie badminton). Reponds UNIQUEMENT avec du JSON {\"valid\":[liste des numeros des articles valides]} en conservant au minimum 8 articles si possible.";
          const v = await mistral(vPrompt);
          const valides = (v.valid || []).map(Number).filter(n => n >= 1 && n <= articles.length);
          if (valides.length >= 6){
          const rejetes = articles.length - valides.length;
          articles = valides.map(n => articles[n - 1]);
          console.log('Verificateur : ' + valides.length + ' valides, ' + rejetes + ' rejetes.');
          } else {
          console.log('Verificateur : reponse trop restrictive, on publie sans filtre ce jour.');
          }
          } catch (e) {
          console.log('Erreur IA verification : ' + e.message);
          }
          }
          const dateFr = new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date());
          const heure = new Date().getUTCHours() + 2; // heure de Paris
          const edition = heure >= 14 ? '17 h' : '7 h';
          // === FUSION : nouvelles articles de l edition + anciens (max 40 au total) ===
          let anciens = [];
          let html = fs.readFileSync('index.html', 'utf8');
          const startTag = '// AUTO-ARTICLES:START';
          const endTag = '// AUTO-ARTICLES:END';
          const start = html.indexOf(startTag);
          const end = html.indexOf(endTag);
          if (start === -1 || end === -1){
          console.log('Marqueurs introuvables dans index.html');
          process.exit(1);
          }
          const ancienBloc = html.slice(start + startTag.length, end);
          try {
          const m = ancienBloc.match(/const ARTICLES = (\[[\s\S]*?\]);/);
          if (m) anciens = JSON.parse(m[1].replace(/,\s*\]/g, ']'));
          } catch (e) {
          console.log('Lecture des anciens articles impossible : nouvelle edition seule.');
          }
          const normaliser = t => String(t || '').toLowerCase().replace(/[^\wÀ-ÿ]/g, '');
          const dejaLa = new Set(anciens.map(a => normaliser(a.title)));
          const nouveaux = articles.filter(a => !dejaLa.has(normaliser(a.title)));
          const tous = nouveaux.concat(anciens).slice(0, 40);
          const entries = tous.slice(0, 40).map((a, i) => {
          const cat = CATS.includes(a.cat) ? a.cat : 'france';
          const obj = {
          id: i + 1,
          cat: cat,
          title: String(a.title || '').slice(0, 140),
          excerpt: String(a.excerpt || '').slice(0, 300),
          body: String(a.body || '').slice(0, 1200),
          source: String(a.source || 'Presse internationale').slice(0, 80),
          sourceUrl: /^https?:\/\//.test(a.sourceUrl || '') ? a.sourceUrl : '',
          verified: true,
          date: a.date || dateFr,
          readTime: a.readTime || '3 min'
          };
          if (i === 0) obj.hero = true;
          return '  ' + JSON.stringify(obj) + ',';
          }).join('\n');
          const block = startTag + '\nconst ARTICLES = [\n' + entries + '\n];\n' + endTag;
          html = html.slice(0, start) + block + html.slice(end + endTag.length);
          fs.writeFileSync('index.html', html);
          console.log('Edition ' + edition + ' publiee : ' + nouveaux.length + ' nouveaux, ' + tous.length + ' articles au total.');
          // === CONTROLE DE COUVERTURE : signaler les rubriques sans article ===
          const catsPresentes = new Set(tous.map(a => a.cat));
          const manquantes = CATS.filter(c => !catsPresentes.has(c));
          if (manquantes.length){
          console.log('Rubriques sans article apres fusion : ' + manquantes.join(', ') + ' (elargissement des sources prevu).');
          } else {
          console.log('Couverture complete : les ' + CATS.length + ' rubriques ont au moins un article.');
          }

          // === NEWSLETTER : envoi du meilleur de l edition a 7h ===
          const BREVO = process.env.BREVO_API_KEY || '';
          const LIST_ID = (process.env.BREVO_LIST_ID || '').trim();
          if (BREVO && LIST_ID && edition === '7 h'){
          try {
          const contactsRes = await fetch('https://api.brevo.com/v3/contacts/lists/' + LIST_ID + '/contacts?limit=50&offset=0', {
          headers: { 'api-key': BREVO }
          });
          const cj = await contactsRes.json();
          const emails = (cj.contacts || []).map(c => c.email).filter(Boolean);
          if (emails.length){
          const top3 = tous.slice(0, 3);
          const objet = '☀️ Votre dose de bonnes nouvelles du ' + dateFr;
          const htmlMail = '<div style="font-family:Georgia,serif;background:#faf8f3;padding:32px;text-align:center;">' +
          '<h2 style="color:#1c1917;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;margin-bottom:6px;">Un bien fou</h2>' +
          '<h1 style="color:#b45309;margin:0 0 24px;font-size:1.5em;">Les bonnes nouvelles du jour ☀️</h1>' +
          top3.map((a, i) => '<div style="background:#fffdf9;border:1px solid #e9e2d4;border-radius:8px;padding:20px 24px;margin:0 auto 16px;max-width:520px;text-align:left;">' +
          '<p style="font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:#059669;font-weight:700;margin:0 0 8px;">✓ Vérifié · ' + (a.cat || '') + '</p>' +
          '<p style="font-size:1.05em;font-weight:700;color:#1c1917;margin:0 0 10px;">' + String(a.title || '').slice(0, 140) + '</p>' +
          '<p style="font-size:.9em;color:#44403c;margin:0 0 14px;">' + String(a.excerpt || '').slice(0, 180) + '</p>' +
          '<a href="https://www.unbienfou.fr" style="background:#1c1917;color:#faf8f3;text-decoration:none;padding:10px 18px;border-radius:4px;font-size:.8rem;font-family:Arial,sans-serif;">Lire sur Un bien fou →</a>' +
          '</div>').join('') +
          '<p style="color:#8a8177;font-size:.75rem;margin-top:28px;font-family:Arial,sans-serif;">Chaque jour à 7h · <a href="https://www.unbienfou.fr" style="color:#b45309;">unbienfou.fr</a></p>' +
          '<p style="color:#b8b0a4;font-size:.68rem;font-family:Arial,sans-serif;">Vous recevez cet e-mail car vous êtes abonné à Un bien fou.</p>' +
          '</div>';
          for (const email of emails){
          await fetch('https://api.brevo.com/v3/smtp/email', {
          method: 'POST',
          headers: { 'api-key': BREVO, 'content-type': 'application/json' },
          body: JSON.stringify({
          sender: { name: 'Un bien fou', email: 'unbienfou.media@gmail.com' },
          to: [{ email: email }],
          subject: objet,
          htmlContent: htmlMail
          })
          });
          }
          console.log('Newsletter envoyee a ' + emails.length + ' abonne(s).');
          } else {
          console.log('Aucun abonne pour le moment : newsletter non envoyee.');
          }
          } catch (e) {
          console.log('Erreur newsletter Brevo : ' + e.message);
          }
          } else if (edition === '17 h') {
          console.log('Edition du soir : pas de newsletter (envoi uniquement a 7h).');
          }
          SCRIPT_EOF
          node update.mjs

      - name: Publier sur GitHub
        run: |
          git config user.name "robot-unbienfou"
          git config user.email "action@github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Edition $(date +%H)h du $(date +%d/%m/%Y)"
            git push
          fi
