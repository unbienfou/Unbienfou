name: Mise a jour quotidienne des articles
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collecter les titres des flux RSS francais
        run: |
          cat > collect.mjs <<'SCRIPT_EOF'
          import fs from 'fs';
          const FEEDS = {
            france: [
              'https://www.francetvinfo.fr/titres.rss',
              'https://www.ladepeche.fr/rss.xml',
              'https://www.20minutes.fr/rss/une.xml'
            ],
            regions: [
              'https://www.ouest-france.fr/rss-en-continu.xml',
              'https://www.ladepeche.fr/rss.xml'
            ],
            sport: [
              'https://www.francetvinfo.fr/sports.rss',
              'https://www.20minutes.fr/rss/sport.xml'
            ],
            innovation: [
              'https://www.francetvinfo.fr/sciences.rss',
              'https://www.lefigaro.fr/sciences/rss.xml'
            ],
            ecologie: [
              'https://www.francetvinfo.fr/environnement.rss',
              'https://www.lefigaro.fr/actualite/france/environnement/rss.xml'
            ],
            sante: [
              'https://www.francetvinfo.fr/sante.rss',
              'https://sante.lefigaro.fr/rss.xml'
            ],
            education: [
              'https://www.lefigaro.fr/actualite/france/education/rss.xml'
            ],
            culture: [
              'https://www.francetvinfo.fr/culture.rss',
              'https://www.20minutes.fr/rss/culture.xml'
            ]
          };
          const CACHE = 'cache.json';
          let seen = {};
          if (fs.existsSync(CACHE)) {
            try { seen = JSON.parse(fs.readFileSync(CACHE, 'utf8')); } catch (e) { seen = {}; }
          }
          const cutoff = Date.now() - 36 * 3600 * 1000;
          const headlines = [];
          for (const [cat, urls] of Object.entries(FEEDS)) {
            for (const url of urls) {
              try {
                const r = await fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0' } });
                if (!r.ok) continue;
                const xml = await r.text();
                const items = xml.match(/<item>[\s\S]*?<\/item>/g) || [];
                for (const it of items) {
                  const t = (it.match(/<title>(?:<!\[CDATA\[)?([\s\S]*?)(?:\]\]>)?<\/title>/) || [])[1];
                  const l = (it.match(/<link>(?:<!\[CDATA\[)?([\s\S]*?)(?:\]\]>)?<\/link>/) || [])[1];
                  const dRaw = (it.match(/<pubDate>([\s\S]*?)<\/pubDate>/) || [])[1];
                  const d = dRaw ? new Date(dRaw).getTime() : Date.now();
                  if (!t || !l) continue;
                  if (d < cutoff) continue;
                  const key = l.trim();
                  if (seen[key] && Date.now() - seen[key] < 10 * 24 * 3600 * 1000) continue;
                  headlines.push({ cat, title: t.trim(), url: key, date: d });
                }
              } catch (e) { console.log('Flux KO: ' + url); }
            }
          }
          const fresh = {};
          headlines.forEach(h => { fresh[h.url] = Date.now(); });
          fs.writeFileSync(CACHE, JSON.stringify({ ...seen, ...fresh }));
          const limited = headlines.slice(0, 60);
          fs.writeFileSync('headlines.json', JSON.stringify(limited, null, 2));
          console.log('Titres collectes: ' + limited.length);
          SCRIPT_EOF
          node collect.mjs

      - name: Generer les articles avec l IA Mistral
        uses: ./.github/actions/mistral
        with:
          api_key: ${{ secrets.MISTRAL_API_KEY }}

      - name: Construire le HTML final
        run: |
          cat > build.mjs <<'SCRIPT_EOF'
          import fs from 'fs';
          const articles = JSON.parse(fs.readFileSync('articles.json', 'utf8')).articles;
          const entries = articles.slice(0, 12).map((a, i) => {
            const body = (a.body || '').split('\n').filter(Boolean).map(p => '<p>' + p + '</p>').join('\n');
            const dateFr = new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
            return {
              id: i + 1,
              cat: a.cat,
              title: a.title,
              excerpt: a.excerpt,
              body: body,
              source: a.source,
              sourceUrl: a.sourceUrl,
              verified: true,
              date: dateFr,
              readTime: a.readTime || '3 min',
              hero: i === 0
            };
          });
          let html = fs.readFileSync('index.html', 'utf8');
          const START = '// AUTO-ARTICLES:START';
          const END = '// AUTO-ARTICLES:END';
          const i0 = html.indexOf(START);
          const i1 = html.indexOf(END);
          if (i0 === -1 || i1 === -1 || i1 <= i0) {
            console.log('ERREUR: marqueurs AUTO-ARTICLES introuvables — publication annulee pour proteger le site.');
            process.exit(1);
          }
          const block = START + '\nconst ARTICLES = ' + JSON.stringify(entries, null, 2) + ';\n' + END;
          html = html.slice(0, i0) + block + html.slice(i1 + END.length);
          if (!html.includes('goatcounter.com/count')) {
            console.log('ERREUR: compteur de visiteurs absent — publication annulee.');
            process.exit(1);
          }
          fs.writeFileSync('index.html', html);
          console.log('Articles publiés: ' + entries.length);
          SCRIPT_EOF
          node build.mjs

      - name: Publier
        run: |
          git config user.name "robot-unbienfou"
          git config user.email "action@github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Articles du $(date +%d/%m/%Y)"
            git push
          fi
