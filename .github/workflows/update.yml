name: Mise a jour quotidienne des articles
on:
  schedule:
    - cron: "0 5,15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generer et verifier les articles de l edition
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
        run: |
          cat > update.mjs <<'SCRIPT_EOF'
          import fs from 'fs';
          const KEY = process.env.MISTRAL_API_KEY || '';
          const FEEDS = {
          france: ['https://www.francetvinfo.fr/titres.rss', 'https://www.20minutes.fr/feeds/rss-une.xml', 'https://www.lafranceagricole.fr/rss/flux.xml', 'https://www.francetvinfo.fr/societe.rss', 'https://www.france24.com/fr/rss', 'https://www.francetvinfo.fr/france.rss', 'https://www.publicsenat.fr/rss.xml', 'https://www.rfi.fr/fr/france/rss', 'https://news.google.com/rss/search?q=recrutement+France+OR+embauche+record+OR+formation+reussite+OR+education+palmares+when:3d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=heros+du+quotidien+OR+sauve+OR+remier+sauvetage+OR+medaille+honneur+OR+recompense+France+when:3d&hl=fr&gl=FR&ceid=FR:fr'],
          regions: ['https://www.actu.fr/rss.xml', 'https://www.ouest-france.fr/rss-en-continu.xml', 'https://www.ladepeche.fr/rss.xml', 'https://www.sudouest.fr/rss.xml', 'https://www.midilibre.fr/rss.xml', 'https://www.lavoixdunord.fr/rss.xml', 'https://www.lunion.fr/rss.xml', 'https://news.google.com/rss/search?q=bonne+nouvelle+OR+solidarit%C3%A9+OR+initiative+OR+r%C3%A9ussite+%22Auvergne-Rh%C3%B4ne-Alpes%22+OR+Lyon+when:3d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=bonne+nouvelle+OR+solidarit%C3%A9+OR+initiative+OR+r%C3%A9ussite+%22Provence-Alpes-C%C3%B4te+d%27Azur%22+OR+Marseille+OR+Corse+when:3d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=bonne+nouvelle+Marseille+OR+sauvetage+Marseille+OR+association+Marseille+when:3d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=bonne+nouvelle+OR+solidarit%C3%A9+OR+initiative+OR+r%C3%A9ussite+%22Grand+Est%22+OR+Alsace+OR+Lorraine+when:3d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=bonne+nouvelle+OR+solidarit%C3%A9+OR+initiative+OR+r%C3%A9ussite+%22Bourgogne-Franche-Comt%C3%A9%22+OR+%22Centre-Val+de+Loire%22+when:3d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=bonne+nouvelle+OR+solidarit%C3%A9+OR+initiative+OR+r%C3%A9ussite+Normandie+OR+%22Pays+de+la+Loire%22+when:3d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=bonne+nouvelle+OR+solidarit%C3%A9+OR+initiative+OR+r%C3%A9ussite+Outre-mer+OR+Guadeloupe+OR+R%C3%A9union+OR+Martinique+when:3d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=record+France+OR+inauguration+OR+benevoles+OR+generosite+OR+don+when:3d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=bonne+nouvelle+Paris+OR+Bordeaux+OR+Toulouse+OR+Nantes+when:3d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=bonne+nouvelle+Strasbourg+OR+Rennes+OR+Lille+OR+Nice+when:3d&hl=fr&gl=FR&ceid=FR:fr',
          'https://www.leparisien.fr/rss.xml',
          'https://www.letelegramme.fr/rss.xml',
          'https://news.google.com/rss/search?q=bonne+nouvelle+OR+solidarit%C3%A9+OR+r%C3%A9ussite+OR+initiative+Corse+when:3d&hl=fr&gl=FR&ceid=FR:fr',
          'https://news.google.com/rss/search?q=bonne+nouvelle+OR+solidarit%C3%A9+OR+r%C3%A9ussite+OR+initiative+Bretagne+OR+Brest+OR+Quimper+when:3d&hl=fr&gl=FR&ceid=FR:fr',
          'https://news.google.com/rss/search?q=bonne+nouvelle+OR+solidarit%C3%A9+OR+r%C3%A9ussite+OR+initiative+Guadeloupe+OR+Martinique+OR+Antilles+when:7d&hl=fr&gl=FR&ceid=FR:fr',
          'https://news.google.com/rss/search?q=bonne+nouvelle+OR+solidarit%C3%A9+OR+r%C3%A9ussite+OR+initiative+Guyane+when:7d&hl=fr&gl=FR&ceid=FR:fr',
          'https://news.google.com/rss/search?q=bonne+nouvelle+OR+solidarit%C3%A9+OR+r%C3%A9ussite+OR+initiative+%22La+R%C3%A9union%22+OR+Mayotte+when:7d&hl=fr&gl=FR&ceid=FR:fr',
          'https://news.google.com/rss/search?q=bonne+nouvelle+OR+solidarit%C3%A9+OR+r%C3%A9ussite+OR+initiative+Polyn%C3%A9sie+OR+%22Nouvelle-Cal%C3%A9donie%22+when:7d&hl=fr&gl=FR&ceid=FR:fr'],
          sport: ['https://www.france24.com/fr/sports/rss', 'https://www.rfi.fr/fr/sports/rss', 'https://www.sport.fr/feed', 'https://www.francetvinfo.fr/sports.rss', 'https://www.lequipe.fr/rss/actu.rss', 'https://rmcsport.bfmtv.com/rss/football/', 'https://rmcsport.bfmtv.com/rss/tennis/', 'https://www.eurosport.fr/rss.xml', 'https://www.lequipe.fr/rss/actu_badminton.rss', 'https://rmcsport.bfmtv.com/rss/badminton/', 'https://rmcsport.bfmtv.com/rss/basket/', 'https://rmcsport.bfmtv.com/rss/handball/', 'https://rmcsport.bfmtv.com/rss/rugby/', 'https://rmcsport.bfmtv.com/rss/cyclisme/', 'https://rmcsport.bfmtv.com/rss/voile/', 'https://rmcsport.bfmtv.com/rss/athletisme/', 'https://rmcsport.bfmtv.com/rss/sports-us/', 'https://news.google.com/rss/search?q=sport+fran%C3%A7ais+victoire+OR+troph%C3%A9e+OR+titre+when:2d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=%22%C3%A9quipe+de+France%22+qualification+OR+victoire+OR+finale+when:3d&hl=fr&gl=FR&ceid=FR:fr', 'https://www.directvelo.com/feed', 'https://www.lequipe.fr/rss/actu_football.rss', 'https://news.google.com/rss/search?q=badminton+France&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=badminton+victoire+OR+championnat+OR+tournoi&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=%22%C3%A9quipe+de+France%22+badminton&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=badminton+when:2d&hl=fr&gl=FR&ceid=FR:fr', 'https://www.badzine.fr/blog-feed.xml', 'https://news.google.com/rss/search?q=exploit+sportif+OR+performance+historique+OR+medaille+OR+record+France+when:3d&hl=fr&gl=FR&ceid=FR:fr',
          'https://news.google.com/rss/search?q=victoire+OR+exploit+OR+record+handball+OR+basket+OR+volley+OR+judo+OR+natation+France+when:3d&hl=fr&gl=FR&ceid=FR:fr',
          'https://news.google.com/rss/search?q=bonne+nouvelle+OR+exploit+OR+record+athl%C3%A9tisme+OR+aviron+OR+escrime+OR+gymnastique+OR+triathlon+France+when:5d&hl=fr&gl=FR&ceid=FR:fr',
          'https://news.google.com/rss/search?q=badminton+France+when:3d&hl=fr&gl=FR&ceid=FR:fr',
          'https://news.google.com/rss/search?q=%22tennis+de+table%22+France+victoire+OR+finale+OR+titre+when:3d&hl=fr&gl=FR&ceid=FR:fr',
          'https://news.google.com/rss/search?q=exploit+OR+victoire+OR+medaille+OR+record+francais+sport+when:2d&hl=fr&gl=FR&ceid=FR:fr',
          'https://news.google.com/rss/search?q=handisport+OR+paralympique+France+medaille+OR+victoire+OR+exploit+when:5d&hl=fr&gl=FR&ceid=FR:fr',
          'https://news.google.com/rss/search?q=victoire+OR+titre+OR+champion+France+natation+OR+escrime+OR+equitation+OR+gymnastique+OR+taekwondo+when:5d&hl=fr&gl=FR&ceid=FR:fr',
          'https://news.google.com/rss/search?q=club+sportif+OR+b%C3%A9n%C3%A9voles+OR+formation+OR+jeunes+sport+r%C3%A9gion+France+when:3d&hl=fr&gl=FR&ceid=FR:fr'],
          innovation: ['https://www.francetvinfo.fr/sciences.rss', 'https://www.cnrs.fr/rss/lesoresdufutur.xml', 'https://www.usine-digitale.com/rss.xml', 'https://www.pourlascience.fr/rss.xml', 'https://www.futura-sciences.com/rss/actualites.xml', 'https://www.sciencesetavenir.com/rss.xml', 'https://trustmyscience.com/feed/', 'https://www.sciencepost.fr/feed/', 'https://www.maxisciences.com/rss.xml', 'https://news.google.com/rss/search?q=innovation+francaise+OR+startup+francaise+OR+prix+innovation+OR+brevet+OR+chercheur+France+when:3d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=prix+Nobel+OR+decouverte+scientifique+OR+recherche+francaise+prim%C3%A9e+when:3d&hl=fr&gl=FR&ceid=FR:fr',
          'https://news.google.com/rss/search?q=innovation+France+when:3d&hl=fr&gl=FR&ceid=FR:fr',
          'https://news.google.com/rss/search?q=invention+OR+%22prix+innovation%22+France+when:7d&hl=fr&gl=FR&ceid=FR:fr'],
          ecologie: ['https://www.actu-environnement.com/rss/flux.xml', 'https://reporterre.net/feed/', 'https://www.goodplanet.org/feed/', 'https://www.vert.eco/feed/', 'https://www.notre-planete.info/rss.xml', 'https://www.futura-sciences.com/rss/planete.xml', 'https://www.bonpote.com/feed/', 'https://news.google.com/rss/search?q=reforestation+OR+depollution+OR+energie+renouvelable+OR+record+environnement+OR+biodiversite+France+when:3d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=animal+sauv%C3%A9+OR+r%C3%A9introduction+OR+esp%C3%A8ce+prot%C3%A9g%C3%A9e+OR+nettoyage+b%C3%A9n%C3%A9voles+when:3d&hl=fr&gl=FR&ceid=FR:fr'],
          sante: ['https://www.pourquoidocteur.fr/feed', 'https://www.lefigaro.fr/rss/figaro_sante.xml', 'https://www.passeportsante.net/rss/rss.xml', 'https://www.francetvinfo.fr/sante.rss', 'https://sante.lefigaro.fr/rss/figaro_sante.xml', 'https://www.futura-sciences.com/rss/sante.xml', 'https://news.google.com/rss/search?q=decouverte+medicale+OR+essai+prometteur+OR+vaccin+OR+guerison+OR+remission+when:3d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=don+du+sang+OR+greffe+OR+hopital+inaugure+OR+reconnaissante+soignants+France+when:3d&hl=fr&gl=FR&ceid=FR:fr'],
          solidarite: ['https://www.20minutes.fr/feeds/rss-societe.xml', 'https://www.goodinfonews.com/rss.xml', 'https://www.huffingtonpost.fr/feeds/index.xml', 'https://www.benevolt.fr/feed/', 'https://reporterre.net/feed/', 'https://www.bonpote.com/feed/', 'https://news.google.com/rss/search?q=don+record+OR+epicerie+sociale+OR+cantine+solidaire+OR+association+benevoles+France+when:3d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=chaine+solidarite+OR+collecte+record+OR+maraude+OR+generosite+quartier+France+when:3d&hl=fr&gl=FR&ceid=FR:fr'],
          culture: ['https://www.francetvinfo.fr/culture.rss', 'https://www.lefigaro.fr/rss/figaro_culture.xml', 'https://www.telerama.fr/rss/television.xml', 'https://www.lesinrocks.com/feed/', 'https://www.telerama.fr/rss/cinema.xml', 'https://news.google.com/rss/search?q=festival+record+OR+restauration+patrimoine+OR+exposition+succes+OR+frequentation+musee+France+when:3d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=succ%C3%A8s+fran%C3%A7ais+OR+palme+OR+c%C3%A9sar+OR+prix+litt%C3%A9raire+OR+triomphe+when:3d&hl=fr&gl=FR&ceid=FR:fr'],
          insolite: ['https://www.francetvinfo.fr/insolite.rss', 'https://www.20minutes.fr/feeds/rss-insolite.xml', 'https://www.maxisciences.com/rss.xml', 'https://news.google.com/rss/search?q=insolite+France+%22bonne+nouvelle%22+OR+cocasse+OR+%C3%A9mouvant&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=histoire+insolite+positive+OR+touchante+OR+d%C3%A9couverte&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=record+insolite+OR+decouverte+incroyable+OR+tresor+France+when:3d&hl=fr&gl=FR&ceid=FR:fr',
          'https://news.google.com/rss/search?q=insolite+OR+touchant+OR+cocasse+France+when:3d&hl=fr&gl=FR&ceid=FR:fr',
          'https://news.google.com/rss/search?q=d%C3%A9couverte+surprenante+OR+red%C3%A9couverte+OR+%C3%A9mouvant+France+when:5d&hl=fr&gl=FR&ceid=FR:fr']
          };
          const CATS = ['france','regions','sport','innovation','ecologie','sante','solidarite','culture','insolite'];
          const feedHealth = [];
          function pick(re, s){
          const m = s.match(re);
          return m ? m[1] : '';
          }

          // === OUTILS ANTI-DOUBLON (partages) : titre + resume, mots singularises, seuil 0.35 ===
          // GARDE-FOU v8 : deux articles ne sont consideres doubles que s'ils partagent AU MOINS 2 mots-cles
          const motsVides = new Set(['le','la','les','un','une','des','du','de','d','l','et','en','a','au','aux','pour','avec','sur','dans','son','sa','ses','est','sont','que','qui','se','ce','cet','cette','apres','avant','plus','moins','par','pas','ne','il','elle','ils','elles','on','nous','vous','du','des','ca','sa','leur','leurs','ceci','cela','cette','tout','tous','toute','toutes','meme','aussi','alors','ainsi','chez','vers','depuis','pendant','selon']);
          const motsCles = t => String(t || '').toLowerCase().split(/\s+/).map(m => m.replace(/[^\wÀ-ÿ]/g, '').replace(/s$/, '')).filter(m => m.length > 3 && !motsVides.has(m));
          const similaires = (t1, t2) => {
          const m1 = new Set(motsCles(t1)), m2 = new Set(motsCles(t2));
          if (!m1.size || !m2.size) return false;
          let communs = 0;
          m1.forEach(m => { if (m2.has(m)) communs++; });
          if (communs < 2) return false;
          return (communs / Math.min(m1.size, m2.size)) >= 0.35;
          };
          const texteArticle = a => String(a.title || '') + ' ' + String(a.excerpt || '');
          function nettoyerDoublons(liste){
          const propres = [];
          for (const a of liste){
          const u = String(a.sourceUrl || '').split('#')[0];
          const ta = texteArticle(a);
          if (propres.some(r => (u && String(r.sourceUrl || '').split('#')[0] === u) || similaires(texteArticle(r), ta))) continue;
          propres.push(a);
          }
          return propres;
          }
          function blocArticlesBrut(liste){
          const lignes = liste.map((a, i) => { const o = Object.assign({}, a); o.id = i + 1; if (i === 0) o.hero = true; else delete o.hero; return '  ' + JSON.stringify(o) + ','; }).join('\n');
          return '// AUTO-ARTICLES:START\nconst ARTICLES = [\n' + lignes + '\n];\n// AUTO-ARTICLES:END';
          }
          async function getHeadlines(){
          let news = [];
          for (const cat of Object.keys(FEEDS)){
          for (const url of FEEDS[cat]){
          try {
          const r = await fetch(url, { headers: { 'user-agent': 'Mozilla/5.0 (compatible: UnBienFouBot/1.0; +https://unbienfou.fr)' }, signal: AbortSignal.timeout(15000) });
          if (!r.ok) continue;
          const xml = await r.text();
          const items = xml.split('<item').slice(1, 20);
          feedHealth.push({ url: url.slice(0, 70), cat: cat, items: items.length });
          for (const it of items){
          const t = pick(/<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/title>/is, it).trim();
          const l = pick(/<link>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/link>/is, it).trim();
          const pd = pick(/<pubDate>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/pubDate>/is, it).trim();
          if (t) news.push({ title: t.replace(/<[^>]+>/g, ''), url: l || url, cat: cat, pub: pd });
          }
          } catch (e) { feedHealth.push({ url: url.slice(0, 70), cat: cat, items: -1 }); }
          }
          }
          const vus = new Set();
          return news.filter(n => !vus.has(n.title) && vus.add(n.title)).slice(0, 250);
          }
          async function mistral(prompt){
          const r = await fetch('https://api.mistral.ai/v1/chat/completions', {
          method: 'POST',
          headers: { 'content-type': 'application/json', authorization: 'Bearer ' + KEY },
          body: JSON.stringify({
          model: 'mistral-small-latest',
          temperature: 0.3,
          response_format: { type: 'json_object' },
          messages: [{ role: 'user', content: prompt }]
          }),
          signal: AbortSignal.timeout(90000)
          });
          if (!r.ok){ const errTxt = await r.text(); throw new Error('API Mistral HTTP ' + r.status + ' : ' + errTxt.slice(0, 200)); }
          const j = await r.json();
          return JSON.parse(j.choices && j.choices[0] && j.choices[0].message.content || '{}');
          }
          let headlines = await getHeadlines();
          console.log('BILAN : ' + headlines.length + ' titres collectes dans les flux.');
          // === FILTRE POLITIQUE (v12) : aucun titre politique n entre dans le journal ===
          const RE_POLITIQUE = /([eé]lection|pr[eé]sidentielle|l[eé]gislative|municipales|r[eé]gionales|s[eé]nat(eur)?|assembl[eé]e nationale|d[eé]put[eé]|ministre|minist[eè]re|gouvernement|candidat|scrutin|urnes|[eé]lys[eé]e|matignon|palais bourbon|sondage|parti |parti,|politique)/i;
          const estPolitique = t => RE_POLITIQUE.test(String(t || ''));
          const nbPolCollecte = headlines.length;
          headlines = headlines.filter(h => !estPolitique(h.title));
          console.log('POLITIQUE : ' + (nbPolCollecte - headlines.length) + ' titre(s) politique(s) ecarte(s) a la collecte.');
          if (!KEY) console.log('ALERTE : la cle MISTRAL_API_KEY est absente ou vide ! Verifier sur GitHub : Settings > Secrets and variables > Actions.');
          let articles = [];
          if (headlines.length >= 3 && KEY){
          const prompt = "Tu es la redaction du site francais Un bien fou (unbienfou.fr), un journal de bonnes nouvelles qui fait du bien. Voici des titres de la presse FRANCAISE recus aujourd'hui, classes par rubrique avec leur lien source :\n" + headlines.map(h => '- [' + h.cat + '] ' + h.title + ' [source: ' + h.url + ']').join('\n') + "\n\nParmi ces titres, selectionne les 24 meilleurs qui racontent une BONNE NOUVELLE (fait divers positif, progres, initiative, reussite, solidarite, victoire). Preferer couvrir des rubriques differentes. IMPORTANT : ne selectionne JAMAIS deux titres qui racontent la MEME information (meme evenement, meme annonce, meme mesure) — si plusieurs titres parlent de la meme chose, garde un seul, le meilleur. IMPORTANT BADMINTON : les titres de badminton (flux Badzine, hebdomadaire) doivent etre classes dans la categorie SPORT — accepte un titre de badminton meme s'il date de la semaine ecoulee, trouve son angle positif (equipe en tete, club qui impressionne), UNIQUEMENT a partir des elements du titre fourni. Mais n'invente JAMAIS : si aucun titre de badminton ne figure ci-dessus, n'en cree pas. Redige 24 articles courts EN FRANCAIS inspires de ces titres (reformule avec prudence, sans inventer de chiffres precis, sans inventer de noms de personnes, de clubs, d'equipes ou d'evenements qui ne figurent pas dans le titre. REGLE ABSOLUE DES NOMS : ne cite JAMAIS le nom d'un adversaire, d'un club, d'une ville ou d'une personne qui ne figure pas MOT POUR MOT dans le titre source. Exemple : si le titre dit seulement « Felix Lebrun champion d'Europe » sans nommer son adversaire, ecris « son adversaire en finale » SANS JAMAIS le nommer — inventer un nom d'adversaire est une faute grave qui detruit la credibilite du journal. ; source = nom du media d'origine). COUVERTURE OBLIGATOIRE : veille a proposer au moins 1 article pour chaque rubrique presente dans les titres ci-dessus ; si une rubrique n'a aucun titre exploitable ce jour, ne la force pas (n'invente rien). IMPORTANT RESULTATS SPORTIFS : si un titre du jour raconte un resultat sportif recent (finale, victoire, titre, medaille, record, qualification), selectionne-le EN PRIORITE — les lecteurs aiment suivre les performances des Francais (badminton, tennis de table, cyclisme, basket...). IMPORTANT POLITIQUE : ne selectionne JAMAIS un titre politique (election, ministre, gouvernement, parlement, parti, reforme, scrutin, elysee) — Un bien fou est un journal 100 pour cent NEUTRE et APOLITIQUE. IMPORTANT RUBRIQUES : garde TOUJOURS la categorie indiquee entre crochets du titre source — un titre de sport RESTE en sport, un titre regional RESTE en regions, un titre de sante RESTE en sante ; ne classe JAMAIS un article en rubrique france si son titre source vient d une autre rubrique. Pour chaque article, recopie EXACTEMENT le lien [source: ...] correspondant dans le champ sourceUrl. Choisis la categorie parmi : france, regions, sport, innovation, ecologie, sante, solidarite, culture, insolite. Si un titre n'est pas une bonne nouvelle, ignore-le. Reponds UNIQUEMENT avec du JSON de la forme {\"articles\":[{\"cat\":\"...\",\"title\":\"...\",\"excerpt\":\"2 phrases\",\"body\":\"3-5 phrases\",\"source\":\"...\",\"sourceUrl\":\"lien exact de la source\",\"readTime\":\"3 min\"}]}";
          try {
          const parsed = await mistral(prompt);
          articles = parsed.articles || [];
          } catch (e) {
          console.log('Erreur IA redaction (tentative 1) : ' + e.message);
