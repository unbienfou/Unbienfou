name: Mise a jour quotidienne des articles
on:
  schedule:
    - cron: "0 5,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generer et verifier les articles de l edition
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          cat > update.mjs <<'SCRIPT_EOF'
          import fs from 'fs';
          const KEY = process.env.MISTRAL_API_KEY || '';
          const FEEDS = {
          france: ['https://www.francetvinfo.fr/titres.rss', 'https://www.20minutes.fr/feeds/rss-une.xml', 'https://www.lafranceagricole.fr/rss/flux.xml', 'https://www.francetvinfo.fr/societe.rss', 'https://www.leparisien.fr/services/rss//rss-une.xml'],
          regions: ['https://www.ouest-france.fr/rss-en-continu.xml', 'https://www.ladepeche.fr/rss.xml', 'https://www.ledauphine.com/rss.xml', 'https://www.ladepeche.fr/rss/actualites.xml', 'https://www.ouest-france.fr/feeds/rss/une-toute', 'https://www.maville.com/rss.xml'],
          sport: ['https://www.francetvinfo.fr/sports.rss', 'https://www.lequipe.fr/rss/actu.rss', 'https://rmcsport.bfmtv.com/rss/football/', 'https://www.francebleu.fr/feeds/rss/sports.rss', 'https://rmcsport.bfmtv.com/rss/tennis/', 'https://www.eurosport.fr/rss.xml'],
          badminton: ['https://news.google.com/rss/search?q=badminton+France&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=badminton+victoire+OR+championnat+OR+tournoi&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=%22%C3%A9quipe+de+France%22+badminton&hl=fr&gl=FR&ceid=FR:fr'],
          innovation: ['https://www.francetvinfo.fr/sciences.rss', 'https://www.sciencesetavenir.com/rss.xml', 'https://www.cnrs.fr/rss/lesoresdufutur.xml', 'https://www.usine-digitale.com/rss.xml', 'https://www.pourlascience.fr/rss.xml'],
          ecologie: ['https://www.actu-environnement.com/rss/flux.xml', 'https://reporterre.net/feed/', 'https://www.goodplanet.org/feed/', 'https://www.notre-planete.info/rss.xml', 'https://www.chasseurimages.com/rss.xml'],
          sante: ['https://www.pourquoidocteur.fr/feed', 'https://www.lefigaro.fr/rss/figaro_sante.xml', 'https://www.passeportsante.net/rss/rss.xml', 'https://www.francetvinfo.fr/sante.rss', 'https://sante.lefigaro.fr/rss/figaro_sante.xml'],
          solidarite: ['https://www.positivr.fr/feed/', 'https://www.20minutes.fr/feeds/rss-societe.xml', 'https://www.goodinfonews.com/rss.xml', 'https://www.huffingtonpost.fr/feeds/index.xml', 'https://reporterre.net/feed/'],
          culture: ['https://www.francetvinfo.fr/culture.rss', 'https://www.lefigaro.fr/rss/figaro_culture.xml', 'https://www.franceinter.fr/rss.xml', 'https://www.telerama.fr/rss/television.xml', 'https://www.lesinrocks.com/feed/'],
          insolite: ['https://www.francetvinfo.fr/insolite.rss', 'https://www.20minutes.fr/feeds/rss-insolite.xml', 'https://www.maxisciences.com/rss.xml']
          };
          const CATS = ['france','regions','sport','badminton','innovation','ecologie','sante','solidarite','culture','insolite'];
          function pick(re, s){
          const m = s.match(re);
          return m ? m[1] : '';
          }
          async function getHeadlines(){
          let news = [];
          for (const cat of Object.keys(FEEDS)){
          for (const url of FEEDS[cat]){
          try {
          const r = await fetch(url, { headers: { 'user-agent': 'Mozilla/5.0 (compatible: UnBienFouBot/1.0; +https://unbienfou.fr)' } });
          if (!r.ok) continue;
          const xml = await r.text();
          const items = xml.split('<item').slice(1, 9);
          for (const it of items){
          const t = pick(/<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/title>/is, it).trim();
          const l = pick(/<link>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/link>/is, it).trim();
          if (t) news.push({ title: t.replace(/<[^>]+>/g, ''), url: l || url, cat: cat });
          }
          } catch (e) {}
          }
          }
          const vus = new Set();
          return news.filter(n => !vus.has(n.title) && vus.add(n.title)).slice(0, 80);
          }
          async function mistral(prompt){
          const r = await fetch('https://api.mistral.ai/v1/chat/completions', {
          method: 'POST',
          headers: { 'content-type': 'application/json', authorization: 'Bearer ' + KEY },
          body: JSON.stringify({
          model: 'mistral-small-latest',
          temperature: 0.3,
          response_format: { type: 'json_object' },
          messages: [{ role: 'user', content: prompt }]
          })
          });
          const j = await r.json();
          return JSON.parse(j.choices && j.choices[0] && j.choices[0].message.content || '{}');
          }
          const headlines = await getHeadlines();
          let articles = [];
          if (headlines.length >= 3 && KEY){
          const prompt = "Tu es la redaction du site francais Un bien fou (unbienfou.fr), un journal de bonnes nouvelles qui fait du bien. Voici des titres de la presse FRANCAISE recus aujourd'hui, classes par rubrique avec leur lien source :\n" + headlines.map(h => '- [' + h.cat + '] ' + h.title + ' [source: ' + h.url + ']').join('\n') + "\n\nParmi ces titres, selectionne les 16 meilleurs qui racontent une BONNE NOUVELLE (fait divers positif, progres, initiative, reussite, solidarite, victoire). Preferer couvrir des rubriques differentes. S'il y a une bonne nouvelle de BADMINTON, garde-la absolument et mets-la dans la categorie badminton. Redige 16 articles courts EN FRANCAIS inspires de ces titres (reformule avec prudence, sans inventer de chiffres precis, source = nom du media d'origine). Pour chaque article, recopie EXACTEMENT le lien [source: ...] correspondant dans le champ sourceUrl, et garde la categorie indiquee entre crochets. Choisis la categorie parmi : france, regions, sport, badminton, innovation, ecologie, sante, solidarite, culture, insolite. Si un titre n'est pas une bonne nouvelle, ignore-le. Reponds UNIQUEMENT avec du JSON de la forme {\"articles\":[{\"cat\":\"...\",\"title\":\"...\",\"excerpt\":\"2 phrases\",\"body\":\"3-5 phrases\",\"source\":\"...\",\"sourceUrl\":\"lien exact de la source\",\"readTime\":\"3 min\"}]}";
          try {
          const parsed = await mistral(prompt);
          articles = parsed.articles || [];
          } catch (e) {
          console.log('Erreur IA redaction : ' + e.message);
          }
          }
          if (!articles.length){
          console.log('Pas de nouvelles pour cette edition : on garde les articles existants.');
          process.exit(0);
          }
          // === AGENT VERIFICATEUR : 2e passe IA ===
          if (articles.length && KEY){
          try {
          const vPrompt = "Tu es l'agent VERIFICATEUR du journal de bonnes nouvelles Un bien fou. Voici des articles proposes par la redaction :\n" + articles.map((a, i) => (i + 1) + '. [' + a.cat + '] ' + a.title + ' — source: ' + (a.sourceUrl || 'AUCUN LIEN')).join('\n') + "\n\nPour chaque article, verifie : (1) le titre raconte bien une BONNE NOUVELLE (fait positif, progres, solidarite, reussite), PAS un simple fait divers neutre ou negatif ; (2) un lien source plausible est fourni ; (3) la categorie est coherente (une histoire de badminton doit rester en categorie badminton). Reponds UNIQUEMENT avec du JSON {\"valid\":[liste des numeros des articles valides]} en conservant au minimum 8 articles si possible.";
          const v = await mistral(vPrompt);
          const valides = (v.valid || []).map(Number).filter(n => n >= 1 && n <= articles.length);
          if (valides.length >= 6){
          const rejetes = articles.length - valides.length;
          articles = valides.map(n => articles[n - 1]);
          console.log('Verificateur : ' + valides.length + ' valides, ' + rejetes + ' rejetes.');
          } else {
          console.log('Verificateur : reponse trop restrictive, on publie sans filtre ce jour.');
          }
          } catch (e) {
          console.log('Erreur IA verification : ' + e.message);
          }
          }
          const dateFr = new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date());
          const heure = new Date().getUTCHours() + 2; // heure de Paris
          const edition = heure >= 14 ? '17 h' : '7 h';
          // === FUSION : nouvelles articles de l edition + anciens (max 40 au total) ===
          let anciens = [];
          let html = fs.readFileSync('index.html', 'utf8');
          const startTag = '// AUTO-ARTICLES:START';
          const endTag = '// AUTO-ARTICLES:END';
          const start = html.indexOf(startTag);
          const end = html.indexOf(endTag);
          if (start === -1 || end === -1){
          console.log('Marqueurs introuvables dans index.html');
          process.exit(1);
          }
          const ancienBloc = html.slice(start + startTag.length, end);
          try {
          const m = ancienBloc.match(/const ARTICLES = (\[[\s\S]*?\]);/);
          if (m) anciens = JSON.parse(m[1]);
          } catch (e) {
          console.log('Lecture des anciens articles impossible : nouvelle edition seule.');
          }
          const normaliser = t => String(t || '').toLowerCase().replace(/[^\wÀ-ÿ]/g, '');
          const dejaLa = new Set(anciens.map(a => normaliser(a.title)));
          const nouveaux = articles.filter(a => !dejaLa.has(normaliser(a.title)));
          const tous = nouveaux.concat(anciens).slice(0, 40);
          const entries = tous.slice(0, 40).map((a, i) => {
          const cat = CATS.includes(a.cat) ? a.cat : 'france';
          const obj = {
          id: i + 1,
          cat: cat,
          title: String(a.title || '').slice(0, 140),
          excerpt: String(a.excerpt || '').slice(0, 300),
          body: String(a.body || '').slice(0, 1200),
          source: String(a.source || 'Presse internationale').slice(0, 80),
          sourceUrl: /^https?:\/\//.test(a.sourceUrl || '') ? a.sourceUrl : '',
          verified: true,
          date: a.date || dateFr,
          readTime: a.readTime || '3 min'
          };
          if (i === 0) obj.hero = true;
          return '  ' + JSON.stringify(obj) + ',';
          }).join('\n');
          const block = startTag + '\nconst ARTICLES = [\n' + entries + '\n];\n' + endTag;
          html = html.slice(0, start) + block + html.slice(end + endTag.length);
          fs.writeFileSync('index.html', html);
          console.log('Edition ' + edition + ' publiee : ' + nouveaux.length + ' nouveaux, ' + tous.length + ' articles au total.');
          SCRIPT_EOF
          node update.mjs

      - name: Publier sur GitHub
        run: |
          git config user.name "robot-unbienfou"
          git config user.email "action@github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Edition $(date +%H)h du $(date +%d/%m/%Y)"
            git push
          fi
