name: Mise a jour quotidienne des articles
on:
  schedule:
    - cron: "0 5,15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generer et verifier les articles de l edition
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
        run: |
          cat > update.mjs <<'SCRIPT_EOF'
          import fs from 'fs';
          const KEY = process.env.MISTRAL_API_KEY || '';
          const FEEDS = {
          france: ['https://www.francetvinfo.fr/titres.rss', 'https://www.20minutes.fr/feeds/rss-une.xml', 'https://www.lafranceagricole.fr/rss/flux.xml', 'https://www.francetvinfo.fr/societe.rss', 'https://www.france24.com/fr/rss', 'https://www.francetvinfo.fr/france.rss', 'https://www.publicsenat.fr/rss.xml'],
          regions: ['https://www.actu.fr/rss.xml', 'https://www.ouest-france.fr/rss-en-continu.xml', 'https://www.ladepeche.fr/rss.xml', 'https://www.sudouest.fr/rss.xml', 'https://www.midilibre.fr/rss.xml', 'https://www.lavoixdunord.fr/rss.xml', 'https://www.lunion.fr/rss.xml', 'https://news.google.com/rss/search?q=bonne+nouvelle+OR+solidarit%C3%A9+OR+initiative+OR+r%C3%A9ussite+%22Auvergne-Rh%C3%B4ne-Alpes%22+OR+Lyon+when:3d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=bonne+nouvelle+OR+solidarit%C3%A9+OR+initiative+OR+r%C3%A9ussite+%22Provence-Alpes-C%C3%B4te+d%27Azur%22+OR+Marseille+OR+Corse+when:3d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=bonne+nouvelle+OR+solidarit%C3%A9+OR+initiative+OR+r%C3%A9ussite+%22Grand+Est%22+OR+Alsace+OR+Lorraine+when:3d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=bonne+nouvelle+OR+solidarit%C3%A9+OR+initiative+OR+r%C3%A9ussite+%22Bourgogne-Franche-Comt%C3%A9%22+OR+%22Centre-Val+de+Loire%22+when:3d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=bonne+nouvelle+OR+solidarit%C3%A9+OR+initiative+OR+r%C3%A9ussite+Normandie+OR+%22Pays+de+la+Loire%22+when:3d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=bonne+nouvelle+OR+solidarit%C3%A9+OR+initiative+OR+r%C3%A9ussite+Outre-mer+OR+Guadeloupe+OR+R%C3%A9union+OR+Martinique+when:3d&hl=fr&gl=FR&ceid=FR:fr'],
          sport: ['https://www.francetvinfo.fr/sports.rss', 'https://www.lequipe.fr/rss/actu.rss', 'https://rmcsport.bfmtv.com/rss/football/', 'https://rmcsport.bfmtv.com/rss/tennis/', 'https://www.eurosport.fr/rss.xml', 'https://www.lequipe.fr/rss/actu_badminton.rss', 'https://rmcsport.bfmtv.com/rss/badminton/', 'https://rmcsport.bfmtv.com/rss/basket/', 'https://rmcsport.bfmtv.com/rss/handball/', 'https://rmcsport.bfmtv.com/rss/rugby/', 'https://rmcsport.bfmtv.com/rss/cyclisme/', 'https://rmcsport.bfmtv.com/rss/voile/', 'https://rmcsport.bfmtv.com/rss/athletisme/', 'https://rmcsport.bfmtv.com/rss/sports-us/', 'https://news.google.com/rss/search?q=sport+fran%C3%A7ais+victoire+OR+troph%C3%A9e+OR+titre+when:2d&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=%22%C3%A9quipe+de+France%22+qualification+OR+victoire+OR+finale+when:3d&hl=fr&gl=FR&ceid=FR:fr', 'https://www.directvelo.com/feed', 'https://www.lequipe.fr/rss/actu_football.rss', 'https://news.google.com/rss/search?q=badminton+France&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=badminton+victoire+OR+championnat+OR+tournoi&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=%22%C3%A9quipe+de+France%22+badminton&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=badminton+when:2d&hl=fr&gl=FR&ceid=FR:fr', 'https://www.badzine.fr/blog-feed.xml'],
          innovation: ['https://www.francetvinfo.fr/sciences.rss', 'https://www.cnrs.fr/rss/lesoresdufutur.xml', 'https://www.usine-digitale.com/rss.xml', 'https://www.pourlascience.fr/rss.xml', 'https://www.futura-sciences.com/rss/actualites.xml', 'https://trustmyscience.com/feed/', 'https://www.sciencepost.fr/feed/', 'https://www.maxisciences.com/rss.xml'],
          ecologie: ['https://www.actu-environnement.com/rss/flux.xml', 'https://reporterre.net/feed/', 'https://www.goodplanet.org/feed/', 'https://www.notre-planete.info/rss.xml', 'https://www.futura-sciences.com/rss/planete.xml', 'https://www.bonpote.com/feed/'],
          sante: ['https://www.pourquoidocteur.fr/feed', 'https://www.lefigaro.fr/rss/figaro_sante.xml', 'https://www.passeportsante.net/rss/rss.xml', 'https://www.francetvinfo.fr/sante.rss', 'https://sante.lefigaro.fr/rss/figaro_sante.xml', 'https://www.futura-sciences.com/rss/sante.xml'],
          solidarite: ['https://www.20minutes.fr/feeds/rss-societe.xml', 'https://www.goodinfonews.com/rss.xml', 'https://www.huffingtonpost.fr/feeds/index.xml', 'https://reporterre.net/feed/', 'https://www.bonpote.com/feed/'],
          culture: ['https://www.francetvinfo.fr/culture.rss', 'https://www.lefigaro.fr/rss/figaro_culture.xml', 'https://www.telerama.fr/rss/television.xml', 'https://www.lesinrocks.com/feed/', 'https://www.telerama.fr/rss/cinema.xml'],
          insolite: ['https://www.francetvinfo.fr/insolite.rss', 'https://www.20minutes.fr/feeds/rss-insolite.xml', 'https://www.maxisciences.com/rss.xml', 'https://news.google.com/rss/search?q=insolite+France+%22bonne+nouvelle%22+OR+cocasse+OR+%C3%A9mouvant&hl=fr&gl=FR&ceid=FR:fr', 'https://news.google.com/rss/search?q=histoire+insolite+positive+OR+touchante+OR+d%C3%A9couverte&hl=fr&gl=FR&ceid=FR:fr']
          };
          const CATS = ['france','regions','sport','innovation','ecologie','sante','solidarite','culture','insolite'];
          const feedHealth = [];
          function pick(re, s){
          const m = s.match(re);
          return m ? m[1] : '';
          }
          async function getHeadlines(){
          let news = [];
          for (const cat of Object.keys(FEEDS)){
          for (const url of FEEDS[cat]){
          try {
          const r = await fetch(url, { headers: { 'user-agent': 'Mozilla/5.0 (compatible: UnBienFouBot/1.0; +https://unbienfou.fr)' }, signal: AbortSignal.timeout(15000) });
          if (!r.ok) continue;
          const xml = await r.text();
          const items = xml.split('<item').slice(1, 14);
          // === SANTE DES FLUX : compter les items par flux pour le bilan ===
          feedHealth.push({ url: url.slice(0, 70), cat: cat, items: items.length });
          for (const it of items){
          const t = pick(/<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/title>/is, it).trim();
          const l = pick(/<link>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/link>/is, it).trim();
          const pd = pick(/<pubDate>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/pubDate>/is, it).trim();
          if (t) news.push({ title: t.replace(/<[^>]+>/g, ''), url: l || url, cat: cat, pub: pd });
          }
          } catch (e) { feedHealth.push({ url: url.slice(0, 70), cat: cat, items: -1 }); }
          }
          }
          const vus = new Set();
          return news.filter(n => !vus.has(n.title) && vus.add(n.title)).slice(0, 140);
          }
          async function mistral(prompt){
          const r = await fetch('https://api.mistral.ai/v1/chat/completions', {
          method: 'POST',
          headers: { 'content-type': 'application/json', authorization: 'Bearer ' + KEY },
          body: JSON.stringify({
          model: 'mistral-small-latest',
          temperature: 0.3,
          response_format: { type: 'json_object' },
          messages: [{ role: 'user', content: prompt }], signal: AbortSignal.timeout(90000)
          })
          });
          const j = await r.json();
          return JSON.parse(j.choices && j.choices[0] && j.choices[0].message.content || '{}');
          }
          const headlines = await getHeadlines();
          let articles = [];
          if (headlines.length >= 3 && KEY){
          const prompt = "Tu es la redaction du site francais Un bien fou (unbienfou.fr), un journal de bonnes nouvelles qui fait du bien. Voici des titres de la presse FRANCAISE recus aujourd'hui, classes par rubrique avec leur lien source :\n" + headlines.map(h => '- [' + h.cat + '] ' + h.title + ' [source: ' + h.url + ']').join('\n') + "\n\nParmi ces titres, selectionne les 16 meilleurs qui racontent une BONNE NOUVELLE (fait divers positif, progres, initiative, reussite, solidarite, victoire). Preferer couvrir des rubriques differentes. IMPORTANT BADMINTON : les titres de badminton (flux Badzine, hebdomadaire) doivent etre classés dans la categorie SPORT — accepte un titre de badminton meme s'il date de la semaine ecoulee, trouve son angle positif (equipe en tete, club qui impressionne), UNIQUEMENT a partir des elements du titre fourni. Mais n'invente JAMAIS : si aucun titre de badminton ne figure ci-dessus, n'en cree pas. Redige 16 articles courts EN FRANCAIS inspires de ces titres (reformule avec prudence, sans inventer de chiffres precis, sans inventer de noms de personnes, de clubs, d'equipes ou d'evenements qui ne figurent pas dans le titre ; source = nom du media d'origine). COUVERTURE OBLIGATOIRE : veille a proposer au moins 1 article pour chaque rubrique presente dans les titres ci-dessus ; si une rubrique n'a aucun titre exploitable ce jour, ne la force pas (n'invente rien). Pour chaque article, recopie EXACTEMENT le lien [source: ...] correspondant dans le champ sourceUrl, et garde la categorie indiquee entre crochets. Choisis la categorie parmi : france, regions, sport, innovation, ecologie, sante, solidarite, culture, insolite. Si un titre n'est pas une bonne nouvelle, ignore-le. Reponds UNIQUEMENT avec du JSON de la forme {\"articles\":[{\"cat\":\"...\",\"title\":\"...\",\"excerpt\":\"2 phrases\",\"body\":\"3-5 phrases\",\"source\":\"...\",\"sourceUrl\":\"lien exact de la source\",\"readTime\":\"3 min\"}]}";
          try {
          const parsed = await mistral(prompt);
          articles = parsed.articles || [];
          } catch (e) {
          console.log('Erreur IA redaction : ' + e.message);
          }
          }
          if (!articles.length){
          console.log('Pas de nouvelles pour cette edition : on garde les articles existants.');
          process.exit(0);
          }
          // === AGENT VERIFICATEUR : 2e passe IA ===
          if (articles.length && KEY){
          try {
          const vPrompt = "Tu es l'agent VERIFICATEUR du journal de bonnes nouvelles Un bien fou. Voici des articles proposes par la redaction :\n" + articles.map((a, i) => (i + 1) + '. [' + a.cat + '] ' + a.title + ' — source: ' + (a.sourceUrl || 'AUCUN LIEN')).join('\n') + "\n\nPour chaque article, verifie : (1) le titre raconte bien une BONNE NOUVELLE (fait positif, progres, solidarite, reussite), PAS un simple fait divers neutre ou negatif ; (2) un lien source plausible est fourni ; (3) la categorie est coherente (une histoire de badminton doit rester en categorie sport) ; (4) ANTI-DOUBLON CRUCIAL : si plusieurs articles traitent du MEME SUJET (meme evenement, meme entreprise, meme annonce, memes mots-cles principaux), ne garde QUE LE MEILLEUR des doublons et rejette les autres — la credibilite du journal depend de l'absence de doublons ; (5) COHERENCE FACTUELLE : rejette tout article contenant une incoherence geographique ou factuelle evident (ex : un produit breton presente comme corse, une ville confondue avec une autre, un evenement decrit hors de son contexte reel) ; (6) VERITE DES SOURCES : le champ sourceUrl doit etre EXACTEMENT un des liens [source: ...] de la liste des titres fournis a la redaction — toute URL fabriquee ou modifiee entraine le rejet de l'article. (7) DIVERSITE GEOGRAPHIQUE : si plusieurs articles concernent la meme region ou la meme ville, ne garde que le meilleur. Reponds UNIQUEMENT avec du JSON {\"valid\":[liste des numeros des articles valides]} en conservant au minimum 8 articles si possible.";
          const v = await mistral(vPrompt);
          const valides = (v.valid || []).map(Number).filter(n => n >= 1 && n <= articles.length);
          if (valides.length >= 6){
          const rejetes = articles.length - valides.length;
          articles = valides.map(n => articles[n - 1]);
          console.log('Verificateur : ' + valides.length + ' valides, ' + rejetes + ' rejetes.');
          } else {
          console.log('Verificateur : reponse trop restrictive, on publie sans filtre ce jour.');
          }
          } catch (e) {
          console.log('Erreur IA verification : ' + e.message);
          }
          }
          // === VERACITE (filtre DETERMINISTE, sans IA) : un article n'est publie que si son URL source a reellement ete collectee dans les flux ===
          const normU = u => String(u || '').split('#')[0].split('?')[0].replace(/\/$/, '');
          const urlsCollectees = new Set(headlines.map(h => normU(h.url)).filter(Boolean));
          const nbAvant = articles.length;
          articles = articles.filter(a => urlsCollectees.has(normU(a.sourceUrl)));
          if (articles.length < nbAvant) console.log('VERACITE : ' + (nbAvant - articles.length) + ' article(s) REJETE(S) : sourceUrl non present dans les flux collectes (invention IA interdite).');
          // === DATES REELLES : chaque article porte la date de parution de sa source, pas la date d'edition ===
          const dateParUrl = {};
          headlines.forEach(h => { if (h.pub) dateParUrl[normU(h.url)] = h.pub; });
          const dateSource = u => {
          const p = dateParUrl[normU(u)];
          if (!p) return '';
          const d = new Date(p);
          return isNaN(d.getTime()) ? '' : new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }).format(d);
          };
          const dateFr = new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date());
          const heure = new Date().getUTCHours() + 2; // heure de Paris
          const edition = heure >= 14 ? '17 h' : '7 h';
          // === FUSION : nouvelles articles de l edition + anciens (max 40 au total) ===
          let anciens = [];
          let html = fs.readFileSync('index.html', 'utf8');
          const startTag = '// AUTO-ARTICLES:START';
          const endTag = '// AUTO-ARTICLES:END';
          const start = html.indexOf(startTag);
          const end = html.indexOf(endTag);
          if (start === -1 || end === -1){
          console.log('Marqueurs introuvables dans index.html');
          process.exit(1);
          }
          const ancienBloc = html.slice(start + startTag.length, end);
          try {
          const m = ancienBloc.match(/const ARTICLES = (\[[\s\S]*?\]);/);
          if (m) anciens = JSON.parse(m[1].replace(/,\s*\]/g, ']'));
          } catch (e) {
          console.log('Lecture des anciens articles impossible : nouvelle edition seule.');
          }
          const normaliser = t => String(t || '').toLowerCase().replace(/[^\wÀ-ÿ]/g, '');
          // === ANTI-DOUBLON RENFORCE : par URL source + similarite de titres ===
          const motsVides = new Set(['le','la','les','un','une','des','du','de','d','l','et','en','a','au','aux','pour','avec','sur','dans','son','sa','ses','est','sont','que','qui','se','ce','cet','cette','apres','avant','plus','moins','par','pas','ne','il','elle','ils','elles','on','nous','vous','du','des','ca','sa']);
          const motsCles = t => String(t || '').toLowerCase().split(/\s+/).map(m => m.replace(/[^\wÀ-ÿ]/g, '')).filter(m => m.length > 3 && !motsVides.has(m));
          const similaires = (t1, t2) => {
          const m1 = new Set(motsCles(t1)), m2 = new Set(motsCles(t2));
          if (!m1.size || !m2.size) return false;
          let communs = 0;
          m1.forEach(m => { if (m2.has(m)) communs++; });
          return (communs / Math.min(m1.size, m2.size)) >= 0.6;
          };
          const urlsSources = new Set(anciens.map(a => String(a.sourceUrl || '').split('#')[0]).filter(Boolean));
          const titresExistants = anciens.map(a => a.title);
          let nouveaux = articles.filter(a => {
          // 1) rejet si meme URL de source (meme article de presse)
          const u = String(a.sourceUrl || '').split('#')[0];
          if (u && urlsSources.has(u)) return false;
          // 2) rejet si titre similaire a un titre existant (meme sujet)
          if (titresExistants.some(t => similaires(t, a.title))) return false;
          return true;
          });
          // 3) dedoublonnage interne : entre les nouveaux articles eux-memes
          const retenus = [];
          for (const a of nouveaux){
          if (!retenus.some(r => (r.sourceUrl || '') === (a.sourceUrl || '') || similaires(r.title, a.title))) retenus.push(a);
          }
          nouveaux = retenus;
          const tous = nouveaux.concat(anciens).slice(0, 40);
          const entries = tous.slice(0, 40).map((a, i) => {
          const cat = CATS.includes(a.cat) ? a.cat : 'france';
          const obj = {
          id: i + 1,
          cat: cat,
          title: String(a.title || '').slice(0, 140),
          excerpt: String(a.excerpt || '').slice(0, 300),
          body: String(a.body || '').slice(0, 1200),
          source: String(a.source || 'Presse internationale').slice(0, 80),
          sourceUrl: /^https?:\/\//.test(a.sourceUrl || '') ? a.sourceUrl : '',
          verified: true,
          date: dateSource(a.sourceUrl) || dateFr,
          readTime: a.readTime || '3 min'
          };
          if (i === 0) obj.hero = true;
          return '  ' + JSON.stringify(obj) + ',';
          }).join('\n');
          const block = startTag + '\nconst ARTICLES = [\n' + entries + '\n];\n' + endTag;
          html = html.slice(0, start) + block + html.slice(end + endTag.length);
          fs.writeFileSync('index.html', html);
          console.log('Edition ' + edition + ' publiee : ' + nouveaux.length + ' nouveaux, ' + tous.length + ' articles au total.');
          // === BILAN DE SANTE DES FLUX (a surveiller dans les logs) ===
          const morts = feedHealth.filter(f => f.items <= 0).map(f => f.url);
          const vivants = feedHealth.filter(f => f.items > 0);
          console.log('BILAN FLUX : ' + vivants.length + ' flux actifs, ' + morts.length + ' flux muets/erreurs sur ' + feedHealth.length + '.');
          if (morts.length) console.log('Flux a remplacer : ' + morts.join(' | '));
          const parCat = {};
          vivants.forEach(f => { parCat[f.cat] = (parCat[f.cat] || 0) + 1; });
          const catsSansFluxActif = ['france','regions','sport','innovation','ecologie','sante','solidarite','culture','insolite'].filter(c => !parCat[c]);
          if (catsSansFluxActif.length) console.log('ATTENTION : aucune source active pour : ' + catsSansFluxActif.join(', '));
          // === CONTROLE DE COUVERTURE : signaler les rubriques sans article ===
          const catsPresentes = new Set(tous.map(a => a.cat));
          const manquantes = CATS.filter(c => !catsPresentes.has(c));
          if (manquantes.length){
          console.log('Rubriques sans article apres fusion : ' + manquantes.join(', ') + ' (elargissement des sources prevu).');
          } else {
          console.log('Couverture complete : les ' + CATS.length + ' rubriques ont au moins un article.');
          }
          // === RAPPORT D'ETAT pour la veille (lu par l'etape suivante du workflow) ===
          fs.writeFileSync('etat-robot.json', JSON.stringify({ date: new Date().toISOString(), edition: edition, fluxTotal: feedHealth.length, fluxActifs: vivants.length, fluxMorts: morts, nouveauxArticles: nouveaux.length, articlesTotal: tous.length, rubriquesVides: manquantes }, null, 2));
          console.log('Rapport etat-robot.json ecrit.');

          // === NEWSLETTER : envoi du meilleur de l edition a 7h ===
          const BREVO = process.env.BREVO_API_KEY || '';
          const LIST_ID = (process.env.BREVO_LIST_ID || '').trim();
          if (BREVO && LIST_ID && edition === '7 h'){
          try {
          const contactsRes = await fetch('https://api.brevo.com/v3/contacts/lists/' + LIST_ID + '/contacts?limit=50&offset=0', {
          headers: { 'api-key': BREVO }
          });
          const cj = await contactsRes.json();
          const emails = (cj.contacts || []).map(c => c.email).filter(Boolean);
          if (emails.length){
          const top3 = tous.slice(0, 3);
          const objet = '☀️ Votre dose de bonnes nouvelles du ' + dateFr;
          const htmlMail = '<div style="font-family:Georgia,serif;background:#faf8f3;padding:32px;text-align:center;">' +
          '<h2 style="color:#1c1917;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;margin-bottom:6px;">Un bien fou</h2>' +
          '<h1 style="color:#b45309;margin:0 0 24px;font-size:1.5em;">Les bonnes nouvelles du jour ☀️</h1>' +
          top3.map((a, i) => '<div style="background:#fffdf9;border:1px solid #e9e2d4;border-radius:8px;padding:20px 24px;margin:0 auto 16px;max-width:520px;text-align:left;">' +
          '<p style="font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:#059669;font-weight:700;margin:0 0 8px;">✓ Vérifié · ' + (a.cat || '') + '</p>' +
          '<p style="font-size:1.05em;font-weight:700;color:#1c1917;margin:0 0 10px;">' + String(a.title || '').slice(0, 140) + '</p>' +
          '<p style="font-size:.9em;color:#44403c;margin:0 0 14px;">' + String(a.excerpt || '').slice(0, 180) + '</p>' +
          '<a href="https://www.unbienfou.fr" style="background:#1c1917;color:#faf8f3;text-decoration:none;padding:10px 18px;border-radius:4px;font-size:.8rem;font-family:Arial,sans-serif;">Lire sur Un bien fou →</a>' +
          '</div>').join('') +
          '<p style="color:#8a8177;font-size:.75rem;margin-top:28px;font-family:Arial,sans-serif;">Chaque jour à 7h · <a href="https://www.unbienfou.fr" style="color:#b45309;">unbienfou.fr</a></p>' +
          '<p style="color:#b8b0a4;font-size:.68rem;font-family:Arial,sans-serif;">Vous recevez cet e-mail car vous êtes abonné à Un bien fou.</p>' +
          '</div>';
          for (const email of emails){
          await fetch('https://api.brevo.com/v3/smtp/email', {
          method: 'POST',
          headers: { 'api-key': BREVO, 'content-type': 'application/json' },
          body: JSON.stringify({
          sender: { name: 'Un bien fou', email: 'unbienfou.media@gmail.com' },
          to: [{ email: email }],
          subject: objet,
          htmlContent: htmlMail
          })
          });
          }
          console.log('Newsletter envoyee a ' + emails.length + ' abonne(s).');
          } else {
          console.log('Aucun abonne pour le moment : newsletter non envoyee.');
          }
          } catch (e) {
          console.log('Erreur newsletter Brevo : ' + e.message);
          }
          } else if (edition === '17 h') {
          console.log('Edition du soir : pas de newsletter (envoi uniquement a 7h).');
          }
          SCRIPT_EOF
          node update.mjs

      - name: Publier sur GitHub
        run: |
          git config user.name "robot-unbienfou"
          git config user.email "action@github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Edition $(date +%H)h du $(date +%d/%m/%Y)"
            git push
          fi
      - name: Veille robot et site - alerte automatique si probleme
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "veille-robot" --color D93F0B --description "Alertes de la veille automatique" 2>/dev/null || true
          PROBLEMES=""
          # --- 1) Le robot a-t-il produit son rapport ? ---
          if [ -f etat-robot.json ]; then
            eval "$(node -e "const e=require('./etat-robot.json'); console.log('NOUVEAUX='+e.nouveauxArticles+'; TOTAL='+e.articlesTotal+'; ACTIFS='+e.fluxActifs+'; MORTS='+e.fluxMorts.length+'; VIDES='+e.rubriquesVides.length);")"
            if [ "$NOUVEAUX" = "0" ]; then PROBLEMES="$PROBLEMES"$'\n'"- Aucun nouvel article dans cette edition (sources ou IA en panne ?)."; fi
            if [ "$TOTAL" -lt 8 ]; then PROBLEMES="$PROBLEMES"$'\n'"- Seulement $TOTAL articles au total sur le site (seuil d'alerte : 8)."; fi
            if [ "$MORTS" -ge 5 ]; then PROBLEMES="$PROBLEMES"$'\n'"- $MORTS flux RSS muets sur $((MORTS+ACTIFS)) : a verifier dans le fichier etat-robot.json du dernier run."; fi
            if [ "$VIDES" -ge 2 ]; then PROBLEMES="$PROBLEMES"$'\n'"- $VIDES rubriques sans aucun article (source a elargir)."; fi
          else
            PROBLEMES="$PROBLEMES"$'\n'"- Le robot n'a pas produit son rapport etat-robot.json : possible crash de l'edition (voir logs du run)."
          fi
          # --- 2) Le site est-il en ligne et bien structure ? ---
          CODE=$(curl -s -o /tmp/site.html -w "%{http_code}" --max-time 25 "https://www.unbienfou.fr/" || echo 000)
          if [ "$CODE" != "200" ]; then
            PROBLEMES="$PROBLEMES"$'\n'"- Le site unbienfou.fr ne repond pas correctement (HTTP $CODE)."
          elif ! grep -q "AUTO-ARTICLES:START" /tmp/site.html; then
            PROBLEMES="$PROBLEMES"$'\n'"- Le site en ligne ne contient plus le bloc articles : structure cassee."
          fi
          # --- 3) Ouvrir, mettre a jour ou fermer le ticket d'alerte ---
          OUVERTE=$(gh issue list --label "veille-robot" --state open --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$PROBLEMES" ]; then
            CORPS="## Veille automatique du $(date '+%d/%m/%Y a %Hh%M')"$'\n'"Problemes detectes par la veille :"$PROBLEMES$'\n\n'"_Cette veille tourne a chaque edition (7h et 17h). Ce ticket se fermera tout seul quand tout rentrera dans l'ordre._"
            if [ -n "$OUVERTE" ]; then
              echo "Problemes persistants : commentaire sur le ticket #$OUVERTE."
              gh issue comment "$OUVERTE" --body "$CORPS"
            else
              echo "Nouveaux problemes : ouverture d'un ticket d'alerte."
              gh issue create --title "Robot ou site Un bien fou - probleme detecte le $(date '+%d/%m/%Y')" --body "$CORPS" --label "veille-robot"
            fi
          else
            if [ -n "$OUVERTE" ]; then
              echo "Retour a la normal : fermeture du ticket #$OUVERTE."
              gh issue close "$OUVERTE" --comment "Tout est redevenu normal le $(date '+%d/%m/%Y a %Hh%M') : veille sans probleme."
            else
              echo "Veille OK : robot et site fonctionnent, aucune alerte."
            fi
          fi
