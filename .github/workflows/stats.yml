name: Statistiques quotidiennes du site
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mesurer le site
        run: |
          cat > stats.mjs <<'SCRIPT_EOF'
          import fs from 'fs';
          const URL_SITE = 'https://www.unbienfou.fr';
          const today = new Date().toISOString().slice(0, 10);
          let status = 'KO';
          let articles = 0;
          let taille = 0;
          try {
            const r = await fetch(URL_SITE);
            status = r.ok ? 'OK' : 'HTTP ' + r.status;
            if (r.ok) {
              const html = await r.text();
              taille = Math.round(html.length / 1024);
              const m = html.match(/const ARTICLES = \[([\s\S]*?)\];/);
              if (m) articles = (m[1].match(/"id":|\bid:/g) || []).length;
            }
          } catch (e) {
            status = 'ERREUR';
          }
          const ligne = today + ',' + status + ',' + articles + ',' + taille + ' Ko';
          // Reconstruction propre du fichier : une seule ligne d'en-tete,
          // suppression des doublons d'en-tete eventuels, remplacement du jour.
          const brut = fs.existsSync('stats.csv') ? fs.readFileSync('stats.csv', 'utf8') : '';
          const lignes = brut.split('\n').map(l => l.trim()).filter(Boolean);
          const data = lignes.filter(l => !l.startsWith('date,'));
          const historique = data.filter(l => !l.startsWith(today + ','));
          const fichier = ['date,statut,articles,taille'].concat(historique, [ligne]).join('\n') + '\n';
          fs.writeFileSync('stats.csv', fichier);
          console.log('Mesure du jour : ' + ligne);
          SCRIPT_EOF
          node stats.mjs

      - name: Publier les stats
        run: |
          git config user.name "robot-unbienfou"
          git config user.email "action@github.com"
          git add stats.csv
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Stats du $(date +%d/%m/%Y)"
            git push
          fi
