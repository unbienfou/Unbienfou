name: Repli edition du matin (7h30 Paris)
on:
  schedule:
    - cron: "30 6 * * *"   # 7h30 heure de Paris (hiver : UTC+1)
  workflow_dispatch:

permissions:
  actions: write

jobs:
  repli:
    runs-on: ubuntu-latest
    steps:
      - name: Declencher l edition du matin si aucun run actif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # === FILET ULTIME (05/11/2026, GO Tony) ===
          # Ce workflow est INDEPENDANT de update.yml : quand GitHub saute tous les crons
          # d un workflow (incident du 04/11 et du 05/11 matin), il declenche ici, separement,
          # l edition du matin a 7h30 Paris. Le garde-fou v12.22 de update.yml garantit que
          # ce run s arrete proprement si l edition + la newsletter du matin sont deja parties.
          ACTIFS=$(gh run list --workflow update.yml --json status --limit 8 --jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting")] | length')
          echo "Runs actifs de update.yml : $ACTIFS"
          if [ "$ACTIFS" != "0" ]; then
            echo "Un run de update.yml est deja en cours ou en attente : le repli ne fait rien (anti double envoi)."
            exit 0
          fi
          echo "Aucun run actif : declenchement manuel de l edition du matin (le garde-fou v12.22 arrete proprement le run si tout est deja parti)."
          gh workflow run update.yml