<style>
  :root { --ink:#0f172a; --muted:#64748b; --teal:#0d9488; --amber:#fbbf24; --emerald:#10b981; --shadow:0 1px 3px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; background:linear-gradient(180deg,#f8fafc,#f1f5f9); color:var(--ink); min-height:100vh; }
  .wrap { max-width:1152px; margin:0 auto; padding:0 16px; }
  header { position:sticky; top:0; z-index:50; background:rgba(255,255,255,.92); backdrop-filter:blur(8px); border-bottom:1px solid #e2e8f0; }
  .hbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; max-width:1152px; margin:0 auto; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.15rem; cursor:pointer; letter-spacing:-.02em; }
  .brand svg { width:36px; height:36px; }
  nav.pills { display:flex; gap:6px; flex-wrap:wrap; }
  .pill { border:1px solid #e2e8f0; background:#fff; color:#334155; border-radius:999px; padding:7px 13px; font-size:.85rem; cursor:pointer; white-space:nowrap; }
  .pill:hover { border-color:var(--teal); color:var(--teal); }
  .pill.active { background:var(--ink); color:#fff; border-color:var(--ink); }
  .hero { display:grid; grid-template-columns:1.25fr 1fr; gap:24px; margin:32px 0; }
  @media (max-width:820px){ .hero { grid-template-columns:1fr; } }
  .hero-card { background:#fff; border:1px solid #e2e8f0; border-radius:20px; padding:28px; box-shadow:var(--shadow); }
  .hero-tag { display:inline-flex; font-size:.78rem; font-weight:700; color:#b45309; background:#fef3c7; border-radius:999px; padding:5px 12px; margin-bottom:14px; }
  .hero-card h1 { font-size:1.9rem; line-height:1.25; letter-spacing:-.03em; margin-bottom:12px; cursor:pointer; }
  .hero-card h1:hover { color:var(--teal); }
  .hero-card p { color:var(--muted); line-height:1.65; margin-bottom:16px; }
  .hero-side { display:flex; flex-direction:column; gap:16px; }
  .mission { background:linear-gradient(135deg,#0d9488,#10b981); color:#fff; border-radius:20px; padding:24px; box-shadow:var(--shadow); }
  .mission h3 { font-size:1.05rem; margin-bottom:8px; }
  .mission p { font-size:.88rem; line-height:1.55; opacity:.94; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .stat { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:14px 8px; text-align:center; }
  .stat b { display:block; font-size:1.25rem; color:var(--teal); }
  .stat span { font-size:.7rem; color:var(--muted); }
  .sec-title { display:flex; align-items:end; justify-content:space-between; margin:40px 0 20px; gap:12px; flex-wrap:wrap; }
  .sec-title h2 { font-size:1.5rem; font-weight:800; letter-spacing:-.02em; }
  .count { font-size:.75rem; color:var(--muted); background:#fff; border:1px solid #e2e8f0; padding:6px 12px; border-radius:999px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
  @media (max-width:900px){ .grid { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:600px){ .grid { grid-template-columns:1fr; } }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:20px; box-shadow:var(--shadow); cursor:pointer; display:flex; flex-direction:column; gap:10px; transition:transform .15s, box-shadow .15s; }
  .card:hover { transform:translateY(-3px); box-shadow:0 6px 22px rgba(15,23,42,.09); }
  .cat-chip { font-size:.72rem; font-weight:700; width:fit-content; padding:4px 10px; border-radius:999px; }
  .card h3 { font-size:1.02rem; line-height:1.35; }
  .card .excerpt { font-size:.86rem; color:var(--muted); line-height:1.55; }
  .card .meta { margin-top:auto; display:flex; justify-content:space-between; font-size:.72rem; color:#94a3b8; padding-top:8px; border-top:1px solid #f1f5f9; }
  .verified { color:var(--emerald); font-weight:600; }
  .nl { margin:48px 0; background:var(--ink); color:#fff; border-radius:20px; padding:36px; display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap; }
  .nl h3 { font-size:1.35rem; margin-bottom:6px; }
  .nl p { font-size:.9rem; opacity:.75; }
  .nl form { display:flex; gap:8px; flex:1; min-width:260px; max-width:420px; }
  .nl input { flex:1; border:none; border-radius:12px; padding:13px 16px; font-size:.95rem; }
  .nl button { border:none; background:var(--amber); color:#78350f; font-weight:800; border-radius:12px; padding:13px 22px; cursor:pointer; font-size:.95rem; }
  .overlay { position:fixed; inset:0; background:rgba(15,23,42,.5); display:flex; align-items:flex-start; justify-content:center; padding:24px 14px; overflow-y:auto; z-index:100; }
  .modal { background:#fff; border-radius:20px; max-width:720px; width:100%; padding:36px; position:relative; margin:auto 0; }
  .modal .close { position:absolute; top:16px; right:16px; border:1px solid #e2e8f0; background:#fff; border-radius:999px; width:34px; height:34px; cursor:pointer; font-size:1rem; color:var(--muted); }
  .modal h1 { font-size:1.6rem; line-height:1.3; margin:14px 0 12px; }
  .modal .body { color:#334155; line-height:1.75; margin:16px 0 20px; }
  .modal .src { font-size:.82rem; color:var(--muted); background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:12px 14px; }
  .backbtn { border:none; background:#f1f5f9; border-radius:10px; padding:8px 14px; cursor:pointer; font-size:.85rem; color:#334155; margin-bottom:20px; }
  .page { max-width:680px; margin:40px auto; background:#fff; border:1px solid #e2e8f0; border-radius:20px; padding:34px; }
  .page h1 { font-size:1.5rem; margin-bottom:18px; }
  .page p { font-size:.92rem; color:#475569; line-height:1.7; margin-bottom:14px; }
  footer { border-top:1px solid #e2e8f0; background:#fff; margin-top:56px; }
  .fgrid { max-width:1152px; margin:0 auto; padding:40px 16px; display:grid; grid-template-columns:repeat(3,1fr); gap:32px; font-size:.88rem; color:var(--muted); }
  @media (max-width:800px){ .fgrid { grid-template-columns:1fr; } }
  .fgrid .fb { display:flex; align-items:center; gap:8px; font-weight:800; color:var(--ink); }
  .fgrid h4 { color:#334155; margin-bottom:10px; }
  .fbottom { border-top:1px solid #f1f5f9; text-align:center; font-size:.75rem; color:#94a3b8; padding:16px; }
  .factions button { display:inline-block; border:none; background:none; color:var(--teal); cursor:pointer; font-size:.88rem; padding:0; margin-right:14px; }
</style>

const ARTICLES = [
  {"id":1,"cat":"france","title":"Des inconnus répondent à l’appel d’un homme et sauvent sa maison de la tempête","excerpt":"Après avoir vu sa maison dévastée par une tempête, un homme a lancé un appel à l’aide à la télévision. Des inconnus se sont mobilisés en masse pour lui venir en aide.","body":"Des dizaines de personnes ont spontanément répondu à l’appel télévisé d’un homme dont la maison avait été gravement endommagée par une tempête. Sans attendre, elles se sont rendues sur place pour couvrir le toit d’une bâche, évitant ainsi d’autres dégâts. Cette solidarité spontanée rappelle la force des liens humains face à l’adversité.","source":"Good News Network","verified":true,"date":"7 oct. 2026","readTime":"3 min","hero":true},
  {"id":2,"cat":"france","title":"Sept pluies d’étoiles filantes illumineront le ciel en octobre","excerpt":"Le mois d’octobre promet d’être magique avec pas moins de sept pluies d’étoiles filantes à observer. Un spectacle céleste à ne pas manquer.","body":"Les amateurs d’astronomie auront de quoi se régaler en octobre, avec une série de pluies d’étoiles filantes visibles tout au long du mois. Ces phénomènes, comme les Draconides ou les Orionides, offriront des moments de contemplation inoubliables. Une invitation à lever les yeux vers le ciel et à redécouvrir la beauté de l’univers.","source":"Space.com","verified":true,"date":"7 oct. 2026","readTime":"3 min"},
  {"id":3,"cat":"france","title":"Un parc solaire en Arabie Saoudite devient un refuge pour les gazelles menacées","excerpt":"Un projet solaire ambitieux en Arabie Saoudite a permis de créer un habitat idéal pour les gazelles du désert, une espèce en danger.","body":"Le parc solaire de Sudair, en Arabie Saoudite, ne se contente pas de produire de l’énergie propre : il offre aussi un sanctuaire aux gazelles du désert, une espèce menacée. Les clôtures du parc et la gestion de l’eau ont permis à ces animaux de prospérer. Une belle illustration de la façon dont les énergies renouvelables peuvent coexister avec la biodiversité.","source":"BBC News","verified":true,"date":"7 oct. 2026","readTime":"3 min"},
  {"id":4,"cat":"france","title":"Un père fait ses premiers pas après un grave accident vasculaire cérébral","excerpt":"Après avoir perdu sa capacité à marcher à cause d’un grave AVC, un père a retrouvé sa mobilité. Ses enfants, incrédules, ont été les premiers à le féliciter.","body":"Grâce à une rééducation intensive et au soutien de sa famille, un homme a réussi à retrouver l’usage de ses jambes après un accident vasculaire cérébral. Ses enfants, qui l’avaient vu perdre sa mobilité, ont été les premiers à crier de joie en le voyant marcher à nouveau. Une victoire qui rappelle l’importance de la persévérance et de l’amour familial.","source":"ABC News","verified":true,"date":"7 oct. 2026","readTime":"3 min"},
  {"id":5,"cat":"france","title":"Le secret de longévité d’un centenaire de l’Oregon : une alimentation saine et une « bonne tête »","excerpt":"À 108 ans, un homme de l’Oregon attribue sa longévité exceptionnelle à une alimentation équilibrée et à une attitude positive. Un modèle à suivre.","body":"John, 108 ans, vit en Oregon et attribue sa vitalité à une alimentation riche en légumes, en fruits et en noix, ainsi qu’à une philosophie de vie optimiste. Il explique que son « bon esprit » et sa capacité à relativiser ont été ses meilleurs alliés. Une preuve que la longévité dépend autant de l’assiette que du moral.","source":"The Oregonian","verified":true,"date":"7 oct. 2026","readTime":"3 min"},
  {"id":6,"cat":"innovation","title":"Nokia et la NASA préparent un réseau 4G sur la Lune","excerpt":"Pour faciliter les communications lunaires, Nokia et la NASA collaborent à l’installation d’un réseau 4G sur notre satellite naturel.","body":"Dans le cadre de la mission Artemis, Nokia et la NASA ont annoncé un partenariat pour déployer un réseau 4G sur la Lune. Ce projet permettra aux astronautes de communiquer plus facilement et de transmettre des données en temps réel. Une avancée technologique qui ouvre la voie à une exploration spatiale plus connectée.","source":"NASA","verified":true,"date":"7 oct. 2026","readTime":"3 min"},
  {"id":7,"cat":"france","title":"Des habitants sauvent une femme prisonnière de sa voiture submergée en Illinois","excerpt":"Une communauté s’est mobilisée pour sauver une femme coincée dans sa voiture, submergée par les eaux. Leur courage a été salué par les autorités locales.","body":"En Illinois, des riverains ont risqué leur vie pour libérer une femme piégée dans sa voiture, emportée par une crue soudaine. Leur intervention rapide a permis de la sauver in extremis. Les autorités ont rendu hommage à leur bravoure, soulignant l’importance de la solidarité en temps de crise.","source":"WGN-TV Chicago","verified":true,"date":"7 oct. 2026","readTime":"3 min"},
  {"id":8,"cat":"france","title":"La Virginie adopte une loi pour effacer les petites infractions du casier judiciaire","excerpt":"La Virginie devient le dernier État américain à adopter une « loi de seconde chance ». Elle permettra aux anciens condamnés de tourner la page.","body":"La Virginie a rejoint la liste des États américains qui effacent automatiquement les petites infractions du casier judiciaire de leurs résidents. Cette mesure vise à leur offrir une nouvelle chance et à faciliter leur réinsertion. Une avancée sociale qui montre que le pardon et la rédemption sont possibles.","source":"The Virginian-Pilot","verified":true,"date":"7 oct. 2026","readTime":"3 min"},
];

var view = "home";

function esc(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}

function catOf(a) {
  var i;
  for (i = 0; i < CATEGORIES.length; i++) if (CATEGORIES[i].id === a.cat) return CATEGORIES[i];
  return { name: a.cat, color: "#64748b", emoji: "\u{1F4E1}" };
}

function renderNav() {
  var html = '<button class="pill ' + (view === "home" ? "active" : "") + '" onclick="go(\'home\')">\u{1F3E0} La Une</button>';
  CATEGORIES.forEach(function(c) {
    html += '<button class="pill ' + (view === c.id ? "active" : "") + '" onclick="go(\'' + c.id + '\')">' + c.emoji + " " + c.name + "</button>";
  });
  document.getElementById("nav").innerHTML = html;
}

function cardHTML(a) {
  var c = catOf(a);
  return '<div class="card" onclick="openA(' + a.id + ')">' +
    '<span class="cat-chip" style="background:' + c.color + '1a; color:' + c.color + '">' + c.emoji + " " + esc(c.name) + "</span>" +
    "<h3>" + esc(a.title) + "</h3>" +
    '<div class="excerpt">' + esc(a.excerpt) + "</div>" +
    '<div class="meta"><span class="verified">' + (a.verified ? "V\u00E9rifi\u00E9" : "") + '</span><span>' + esc(a.date) + " \u00B7 " + esc(a.readTime) + "</span></div>" +
  "</div>";
}

function newsletterHTML() {

    '<input type="email" required placeholder="votre@email.fr">' +
    "<button type=\"submit\">S\u2019abonner</button></form></div>";

function pageHTML() {
  var m = (view === "mentions")
    ? "<h1>Mentions l\u00E9gales</h1>" +
      "<p><strong>\u00C9diteur du site :</strong> Un bien fou \u2014 Tony Roche, en qualit\u00E9 de directeur de la publication.</p>" +
      "<p><strong>Nom de domaine :</strong> unbienfou.fr (registre OVHcloud / AFNIC).</p>" +
      "<p><strong>H\u00E9bergeur :</strong> Vercel Inc., 440 N Barranca Ave #4133, Covina, CA 91723, \u00C9tats-Unis \u2014 vercel.com.</p>" +
      "<p><strong>Contact :</strong> bonjour@unbienfou.fr</p>" +
      '<p style="font-size:.78rem;color:#94a3b8">Document type \u00E0 compl\u00E9ter au lancement r\u00E9el (SIRET le cas \u00E9ch\u00E9ant). La d\u00E9signation d\u2019un directeur de la publication est obligatoire pour tout \u00E9diteur de contenu en ligne (loi n\u00B0 2004-575 du 21 juin 2004).</p>'
    : "<h1>Transparence IA</h1>" +
      "<p><strong>Comment nos articles sont produits.</strong> Chaque matin, des agents logiciels collectent des informations publi\u00E9es par des sources officielles et de presse (minist\u00E8res, INSEE, collectivit\u00E9s, f\u00E9d\u00E9rations). Des agents IA r\u00E9digent ensuite les articles \u00E0 partir de ces seules sources, un agent v\u00E9rificateur contr\u00F4le chaque fait, et un agent \u00AB r\u00E9dacteur en chef \u00BB valide le tout. Un humain supervise la file des cas sensibles.</p>" +
      "<p><strong>Nos r\u00E8gles absolues :</strong> aucun fait invent\u00E9, aucune citation fabriqu\u00E9e, aucune image sous droit d\u2019auteur, et tout article non conforme est rejet\u00E9, jamais publi\u00E9.</p>" +
      "<p><strong>Publicit\u00E9 :</strong> les contenus publicitaires et partenaires sont toujours clairement identifi\u00E9s comme tels.</p>";
  document.getElementById("main").innerHTML =
    '<div class="page"><button class="backbtn" onclick="go(\'home\')">\u2190 Retour</button>' + m + "</div>";
}

function renderMain() {
  if (view === "mentions" || view === "transparence") { pageHTML(); return; }
  var hero = null, list = [], i;
  for (i = 0; i < ARTICLES.length; i++) {
    if (ARTICLES[i].hero) hero = ARTICLES[i];
  }
  for (i = 0; i < ARTICLES.length; i++) {
    if (view === "home" && !ARTICLES[i].hero) list.push(ARTICLES[i]);
    if (view !== "home" && ARTICLES[i].cat === view) list.push(ARTICLES[i]);
  }
  var cat = null;
  for (i = 0; i < CATEGORIES.length; i++) if (CATEGORIES[i].id === view) cat = CATEGORIES[i];

  var heroHTML = "";
  if (view === "home" && hero) {
    heroHTML = '<div class="hero">' +
      '<div class="hero-card">' +
        '<span class="hero-tag">\u2600\uFE0F \u00C0 la Une aujourd\u2019hui</span>' +
        "<h1 onclick=\"openA(" + hero.id + ')">' + esc(hero.title) + "</h1>" +
        "<p>" + esc(hero.excerpt) + "</p>" +
        '<span style="font-size:.78rem;color:#94a3b8">\u2713 V\u00E9rifi\u00E9 \u00B7 ' + esc(hero.date) + " \u00B7 " + esc(hero.readTime) + " de lecture</span>" +
      "</div>" +
      '<div class="hero-side">' +
        '<div class="mission"><h3>Notre mission</h3><p>Chaque jour, nos 14 agents IA collectent, r\u00E9digent et v\u00E9rifient les nouvelles qui font du bien en France. 100 % sourc\u00E9, 100 % gratuit.</p></div>' +
        '<div class="stats">' +
          '<div class="stat"><b>14</b><span>agents IA</span></div>' +
          '<div class="stat"><b>8</b><span>rubriques</span></div>' +
          '<div class="stat"><b>' + ARTICLES.length + "</b><span>articles</span></div>" +
        "</div>" +
      "</div>" +
    "</div>";
  }

  var title = view === "home" ? "Tout ce qui fait du bien aujourd\u2019hui" : cat.emoji + " " + cat.name;
  var cards = "";
  list.forEach(function(a) { cards += cardHTML(a); });

  document.getElementById("main").innerHTML =
    heroHTML +
    '<div class="sec-title"><h2>' + title + '</h2><span class="count">' + list.length + " article(s) \u00B7 mis \u00E0 jour \u00E0 7h00</span></div>" +

}

function openA(id) {
  var a = null, i;
  for (i = 0; i < ARTICLES.length; i++) if (ARTICLES[i].id === id) a = ARTICLES[i];
  if (!a) return;
  var c = catOf(a);
  var ov = document.createElement("div");
  ov.className = "overlay";
  ov.setAttribute("onclick", "if(event.target===this)this.remove()");
  ov.innerHTML = '<div class="modal">' +
    '<button class="close" onclick="this.parentNode.remove()">\u2715</button>' +
    '<span class="cat-chip" style="background:' + c.color + '1a; color:' + c.color + '">' + c.emoji + " " + esc(c.name) + "</span>" +
    "<h1>" + esc(a.title) + "</h1>" +
    '<div style="font-size:.8rem;color:#94a3b8">\u2713 V\u00E9rifi\u00E9 \u00B7 ' + esc(a.date) + " \u00B7 " + esc(a.readTime) + " de lecture</div>" +
    '<div class="body">' + esc(a.excerpt) + "<br><br>" + esc(a.body) + "</div>" +
    '<div class="src">Source : ' + esc(a.source) + "</div>" +
    '<button class="backbtn" onclick="this.parentNode.remove()">\u2190 Retour \u00E0 la Une</button>' +
  "</div>";
  document.body.appendChild(ov);
}

function go(v) { view = v; renderNav(); renderMain(); window.scrollTo(0, 0); }

document.getElementById("frub").textContent = CATEGORIES.map(function(c) { return c.name; }).join(" \u00B7 ");
go("home");
</script>
</body>
</html>
