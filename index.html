  {"id":1,"cat":"innovation","title":"Sophie Adenot, de retour sur Terre après 235 jours dans l’espace : un retour triomphal","excerpt":"L’astronaute française Sophie Adenot a amerri en Californie après une mission historique de huit mois. Son retour, marqué par une émotion palpable, a été salué comme une réussite collective.","body":"Après 235 jours passés dans l’espace, Sophie Adenot a retrouvé la Terre ferme ce week-end, clôturant une mission spatiale riche en défis et en découvertes. Son discours, empreint d’émotion, a touché des millions de personnes : « Les larmes suivent la pesanteur maintenant », a-t-elle confié, évoquant le contraste entre l’apesanteur et la gravité terrestre. De son décollage à son amerrissage, son aventure a été suivie avec passion par le grand public, rappelant l’importance des missions spatiales pour la science et l’inspiration collective. Son retour marque aussi une étape symbolique pour la France, renforçant sa place dans l’exploration spatiale.","source":"Franceinfo","sourceUrl":"https://www.franceinfo.fr/sciences/espace/sophie-adenot/les-larmes-suivent-l-apesanteur-maintenant-sophie-adenot-prononce-un-emouvant-discours-apres-son-retour-sur-la-terre-ferme_8231197.html#xtor=RSS-3-[lestitres]","verified":true,"date":"10 oct. 2026","readTime":"3 min","hero":true},
  {"id":2,"cat":"ecologie","title":"Le « Jour de la nuit » : une mobilisation citoyenne contre la pollution lumineuse","excerpt":"Ce samedi, des centaines de villes françaises participeront à l’extinction des lumières pour sensibiliser à la pollution lumineuse. Une initiative qui allie écologie et poésie.","body":"Pour la 18e édition du « Jour de la nuit », des balades nocturnes, des observations des étoiles et des extinctions d’éclairages publics sont organisées dans toute la France. L’objectif ? Montrer l’impact de la lumière artificielle sur la biodiversité et le ciel étoilé. Des associations, des collectivités et des citoyens se mobilisent pour préserver l’obscurité naturelle, essentielle pour de nombreuses espèces animales et végétales. Une action simple mais puissante, qui rappelle que la protection de l’environnement passe aussi par des gestes concrets et accessibles.","source":"Franceinfo","sourceUrl":"https://www.franceinfo.fr/environnement/pollution/extinction-des-lumieres-balade-nocturne-comment-participer-au-jour-de-la-nuit-ce-samedi-pour-lutter-contre-la-pollution-lumineuse_8227069.html#xtor=RSS-3-[lestitres]","verified":true,"date":"10 oct. 2026","readTime":"3 min"},
  {"id":3,"cat":"sante","title":"La danse-thérapie : une bouffée d’oxygène pour la santé mentale","excerpt":"Une nouvelle approche thérapeutique séduit de plus en plus de patients en quête de bien-être. La danse-thérapie, entre mouvement et expression, offre une échappatoire au quotidien.","body":"« Ça permet d’apaiser un petit peu le mental, de sortir du quotidien » : c’est ainsi que les participants décrivent la danse-thérapie, une méthode qui gagne en popularité pour soigner l’anxiété et le stress. En combinant danse et psychologie, cette pratique aide à libérer les émotions et à retrouver un équilibre intérieur. De plus en plus de centres de santé mentale intègrent cette approche, preuve que le corps et l’esprit peuvent se renforcer mutuellement. Une initiative qui montre que la guérison passe aussi par la créativité et le mouvement.","source":"Franceinfo","sourceUrl":"https://www.franceinfo.fr/sante/psycho-bien-etre/reportage-ca-permet-d-apaiser-un-petit-peu-le-mental-de-sortir-du-quotidien-la-danse-therapie-pour-soigner-sa-sante-mentale_8230576.html#xtor=RSS-3-[lestitres]","verified":true,"date":"10 oct. 2026","readTime":"3 min"},

  var html = '<button class="pill ' + (view === "home" ? "active" : "") + '" onclick="go(\'home\')">\u{1F3E0} La Une</button>';
  CATEGORIES.forEach(function(c) {
    html += '<button class="pill ' + (view === c.id ? "active" : "") + '" onclick="go(\'' + c.id + '\')">' + c.emoji + " " + c.name + "</button>";
  });
  document.getElementById("nav").innerHTML = html;
}

function cardHTML(a) {
  var c = catOf(a);
  return '<div class="card" onclick="openA(' + a.id + ')">' +
    '<span class="cat-chip" style="background:' + c.color + '1a; color:' + c.color + '">' + c.emoji + " " + esc(c.name) + "</span>" +
    "<h3>" + esc(a.title) + "</h3>" +
    '<div class="excerpt">' + esc(a.excerpt) + "</div>" +
    '<div class="meta"><span class="verified">' + (a.verified ? "V\u00E9rifi\u00E9" : "") + '</span><span>' + esc(a.date) + " \u00B7 " + esc(a.readTime) + "</span></div>" +
  "</div>";
}

function newsletterHTML() {
  return '<div class="nl">' +
    '<div><h3>La bonne humeur dans votre bo\u00EEte mail \u2600\uFE0F</h3><p>Chaque matin \u00E0 7h, une s\u00E9lection d\u2019actualit\u00E9s qui font du bien. Gratuit, sans spam.</p></div>' +
    '<form onsubmit="event.preventDefault(); this.innerHTML=\'<p>Merci ! \u00C0 demain matin, 7h00 \u2600\uFE0F</p>\';">' +
    '<input type="email" required placeholder="votre@email.fr">' +
    "<button type=\"submit\">S\u2019abonner</button></form></div>";
}

function pageHTML() {
  var m = (view === "mentions")
    ? "<h1>Mentions l\u00E9gales</h1>" +
      "<p><strong>\u00C9diteur du site :</strong> Un bien fou \u2014 Tony Roche, en qualit\u00E9 de directeur de la publication.</p>" +
      "<p><strong>Nom de domaine :</strong> unbienfou.fr (registre OVHcloud / AFNIC).</p>" +
      "<p><strong>H\u00E9bergeur :</strong> Vercel Inc., 440 N Barranca Ave #4133, Covina, CA 91723, \u00C9tats-Unis \u2014 vercel.com.</p>" +
      "<p><strong>Contact :</strong> bonjour@unbienfou.fr</p>" +
      '<p style="font-size:.78rem;color:#94a3b8">Document type \u00E0 compl\u00E9ter au lancement r\u00E9el (SIRET le cas \u00E9ch\u00E9ant). La d\u00E9signation d\u2019un directeur de la publication est obligatoire pour tout \u00E9diteur de contenu en ligne (loi n\u00B0 2004-575 du 21 juin 2004).</p>'
    : "<h1>Transparence IA</h1>" +
      "<p><strong>Comment nos articles sont produits.</strong> Chaque matin, des agents logiciels collectent des informations publi\u00E9es par des sources officielles et de presse (minist\u00E8res, INSEE, collectivit\u00E9s, f\u00E9d\u00E9rations). Des agents IA r\u00E9digent ensuite les articles \u00E0 partir de ces seules sources, un agent v\u00E9rificateur contr\u00F4le chaque fait, et un agent \u00AB r\u00E9dacteur en chef \u00BB valide le tout. Un humain supervise la file des cas sensibles.</p>" +
      "<p><strong>Nos r\u00E8gles absolues :</strong> aucun fait invent\u00E9, aucune citation fabriqu\u00E9e, aucune image sous droit d\u2019auteur, et tout article non conforme est rejet\u00E9, jamais publi\u00E9.</p>" +
      "<p><strong>Publicit\u00E9 :</strong> les contenus publicitaires et partenaires sont toujours clairement identifi\u00E9s comme tels.</p>";
  document.getElementById("main").innerHTML =
    '<div class="page"><button class="backbtn" onclick="go(\'home\')">\u2190 Retour</button>' + m + "</div>";
}

function renderMain() {
  if (view === "mentions" || view === "transparence") { pageHTML(); return; }
  var hero = null, list = [], i;
  for (i = 0; i < ARTICLES.length; i++) {
    if (ARTICLES[i].hero) hero = ARTICLES[i];
  }
  for (i = 0; i < ARTICLES.length; i++) {
    if (view === "home" && !ARTICLES[i].hero) list.push(ARTICLES[i]);
    if (view !== "home" && ARTICLES[i].cat === view) list.push(ARTICLES[i]);
  }
  var cat = null;
  for (i = 0; i < CATEGORIES.length; i++) if (CATEGORIES[i].id === view) cat = CATEGORIES[i];

  var heroHTML = "";
  if (view === "home" && hero) {
    heroHTML = '<div class="hero">' +
      '<div class="hero-card">' +
        '<span class="hero-tag">\u2600\uFE0F \u00C0 la Une aujourd\u2019hui</span>' +
        "<h1 onclick=\"openA(" + hero.id + ')">' + esc(hero.title) + "</h1>" +
        "<p>" + esc(hero.excerpt) + "</p>" +
        '<span style="font-size:.78rem;color:#94a3b8">\u2713 V\u00E9rifi\u00E9 \u00B7 ' + esc(hero.date) + " \u00B7 " + esc(hero.readTime) + " de lecture</span>" +
      "</div>" +
      '<div class="hero-side">' +
        '<div class="mission"><h3>Notre mission</h3><p>Chaque jour, nos 4 agents IA collectent, r\u00E9digent et v\u00E9rifient les nouvelles qui font du bien en France. 100 % sourc\u00E9, 100 % gratuit.</p></div>' +
        '<div class="stats">' +
          '<div class="stat"><b>4</b><span>agents IA</span></div>' +
          '<div class="stat"><b>8</b><span>rubriques</span></div>' +
          '<div class="stat"><b>' + ARTICLES.length + "</b><span>articles</span></div>" +
        "</div>" +
      "</div>" +
    "</div>";
  }

  var title = view === "home" ? "Tout ce qui fait du bien aujourd\u2019hui" : cat.emoji + " " + cat.name;
  var cards = "";
  list.forEach(function(a) { cards += cardHTML(a); });

  document.getElementById("main").innerHTML =
    heroHTML +
    '<div class="sec-title"><h2>' + title + '</h2><span class="count">' + list.length + " article(s) \u00B7 mis \u00E0 jour \u00E0 7h00</span></div>" +
    '<div class="grid">' + cards + "</div>" +
    newsletterHTML();
}

function openA(id) {
  var a = null, i;
  for (i = 0; i < ARTICLES.length; i++) if (ARTICLES[i].id === id) a = ARTICLES[i];
  if (!a) return;
  var c = catOf(a);
  var ov = document.createElement("div");
  ov.className = "overlay";
  ov.setAttribute("onclick", "if(event.target===this)this.remove()");
  ov.innerHTML = '<div class="modal">' +
    '<button class="close" onclick="this.parentNode.remove()">\u2715</button>' +
    '<span class="cat-chip" style="background:' + c.color + '1a; color:' + c.color + '">' + c.emoji + " " + esc(c.name) + "</span>" +
    "<h1>" + esc(a.title) + "</h1>" +
    '<div style="font-size:.8rem;color:#94a3b8">\u2713 V\u00E9rifi\u00E9 \u00B7 ' + esc(a.date) + " \u00B7 " + esc(a.readTime) + " de lecture</div>" +
    '<div class="body">' + esc(a.excerpt) + "<br><br>" + esc(a.body) + "</div>" +
    '<div class="src">Source : ' + esc(a.source) + (a.sourceUrl ? ' · <a href="' + esc(a.sourceUrl) + '" target="_blank" rel="noopener" style="color:var(--teal);font-weight:700;text-decoration:none;">📖 Voir la source</a>' : '') + "</div>" +
    '<button class="backbtn" onclick="this.parentNode.remove()">\u2190 Retour \u00E0 la Une</button>' +
  "</div>";
  document.body.appendChild(ov);
}

function go(v) { view = v; renderNav(); renderMain(); window.scrollTo(0, 0); }

document.getElementById("frub").textContent = CATEGORIES.map(function(c) { return c.name; }).join(" \u00B7 ");
go("home");
</script>
