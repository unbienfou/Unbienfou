      "<p><strong>Publicit\u00E9 :</strong> les contenus publicitaires et partenaires sont toujours clairement identifi\u00E9s comme tels.</p>";
  document.getElementById("main").innerHTML =
    '<div class="page"><button class="backbtn" onclick="go(\'home\')">\u2190 Retour</button>' + m + "</div>";
}

function renderMain() {
  if (view === "mentions" || view === "transparence") { pageHTML(); return; }
  var hero = null, list = [], i;
  for (i = 0; i < ARTICLES.length; i++) {
    if (ARTICLES[i].hero) hero = ARTICLES[i];
  }
  for (i = 0; i < ARTICLES.length; i++) {
    if (view === "home" && !ARTICLES[i].hero) list.push(ARTICLES[i]);
    if (view !== "home" && ARTICLES[i].cat === view) list.push(ARTICLES[i]);
  }
  var cat = null;
  for (i = 0; i < CATEGORIES.length; i++) if (CATEGORIES[i].id === view) cat = CATEGORIES[i];

  var heroHTML = "";
  if (view === "home" && hero) {
    heroHTML = '<div class="hero">' +
      '<div class="hero-card">' +
        '<span class="hero-tag">\u2600\uFE0F \u00C0 la Une aujourd\u2019hui</span>' +
        "<h1 onclick=\"openA(" + hero.id + ')">' + esc(hero.title) + "</h1>" +
        "<p>" + esc(hero.excerpt) + "</p>" +
        '<span style="font-size:.78rem;color:#94a3b8">\u2713 V\u00E9rifi\u00E9 \u00B7 ' + esc(hero.date) + " \u00B7 " + esc(hero.readTime) + " de lecture</span>" +
      "</div>" +
      '<div class="hero-side">' +
        '<div class="mission"><h3>Notre mission</h3><p>Chaque jour, nos 14 agents IA collectent, r\u00E9digent et v\u00E9rifient les nouvelles qui font du bien en France. 100 % sourc\u00E9, 100 % gratuit.</p></div>' +
        '<div class="stats">' +
          '<div class="stat"><b>14</b><span>agents IA</span></div>' +
          '<div class="stat"><b>8</b><span>rubriques</span></div>' +
          '<div class="stat"><b>' + ARTICLES.length + "</b><span>articles</span></div>" +
        "</div>" +
      "</div>" +
    "</div>";
  }

  var title = view === "home" ? "Tout ce qui fait du bien aujourd\u2019hui" : cat.emoji + " " + cat.name;
  var cards = "";
  list.forEach(function(a) { cards += cardHTML(a); });

  document.getElementById("main").innerHTML =
    heroHTML +
    '<div class="sec-title"><h2>' + title + '</h2><span class="count">' + list.length + " article(s) \u00B7 mis \u00E0 jour \u00E0 7h00</span></div>" +
    '<div class="grid">' + cards + "</div>" +
    newsletterHTML();
}

function openA(id) {
  var a = null, i;
  for (i = 0; i < ARTICLES.length; i++) if (ARTICLES[i].id === id) a = ARTICLES[i];
  if (!a) return;
  var c = catOf(a);
  var ov = document.createElement("div");
  ov.className = "overlay";
  ov.setAttribute("onclick", "if(event.target===this)this.remove()");
  ov.innerHTML = '<div class="modal">' +
    '<button class="close" onclick="this.parentNode.remove()">\u2715</button>' +
    '<span class="cat-chip" style="background:' + c.color + '1a; color:' + c.color + '">' + c.emoji + " " + esc(c.name) + "</span>" +
    "<h1>" + esc(a.title) + "</h1>" +
    '<div style="font-size:.8rem;color:#94a3b8">\u2713 V\u00E9rifi\u00E9 \u00B7 ' + esc(a.date) + " \u00B7 " + esc(a.readTime) + " de lecture</div>" +
    '<div class="body">' + esc(a.excerpt) + "<br><br>" + esc(a.body) + "</div>" +
    '<div class="src">Source : ' + esc(a.source) + (a.sourceUrl ? ' · <a href="' + esc(a.sourceUrl) + '" target="_blank" rel="noopener" style="color:var(--teal);font-weight:700;text-decoration:none;">📖 Voir la source</a>' : '') + "</div>" +
    '<button class="backbtn" onclick="this.parentNode.remove()">\u2190 Retour \u00E0 la Une</button>' +
  "</div>";
  document.body.appendChild(ov);
}

function go(v) { view = v; renderNav(); renderMain(); window.scrollTo(0, 0); }

document.getElementById("frub").textContent = CATEGORIES.map(function(c) { return c.name; }).join(" \u00B7 ");
go("home");
</script>
</body>
</html>
